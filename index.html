/* =====================================================================
   HARSHAAD — a personal digital universe
   Single-file application. Sections:
   1. Tokens & reset   2. Typography   3. Layout & chrome   4. Components
   5. Prose (reading)  6. Page-specific  7. Themes (10)    8. Studio
   9. Motion & a11y    10. Print
   ===================================================================== */

/* ---------- 1. Tokens & reset ---------- */
:root{
  --bg:#F3EEE4; --bg-2:#ECE5D8; --surface:#F8F4EC; --ink:#1E1B18; --ink-2:#47413A; --muted:#7A7166;
  --rule:#D9D0C1; --rule-strong:#B9AE9C; --accent:#7A2836; --accent-2:#2F4A3A; --accent-ink:#F8F4EC;
  --accent-soft:color-mix(in oklab, var(--accent) 12%, transparent);
  --sel:color-mix(in oklab, var(--accent) 22%, transparent);
  --f-display:"Cormorant Garamond", "EB Garamond", Garamond, "Times New Roman", serif;
  --f-serif:"EB Garamond", Garamond, Georgia, "Times New Roman", serif;
  --f-sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --measure:36rem; --wide:74rem; --space:1; --radius:2px;
  --body-size:clamp(1.08rem, 1rem + .35vw, 1.22rem); --body-lh:1.62;
  --s1:calc(.25rem * var(--space)); --s2:calc(.5rem * var(--space)); --s3:calc(.75rem * var(--space));
  --s4:calc(1rem * var(--space)); --s5:calc(1.5rem * var(--space)); --s6:calc(2.25rem * var(--space));
  --s7:calc(3.5rem * var(--space)); --s8:calc(5.5rem * var(--space)); --s9:calc(8rem * var(--space));
  --gutter:clamp(1.15rem, 4vw, 3rem);
  --header-h:4.5rem;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%; scroll-padding-top:calc(var(--header-h) + 1rem)}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-serif); font-size:var(--body-size); line-height:var(--body-lh);
  text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased; font-kerning:normal; font-variant-ligatures:common-ligatures;
  transition:background-color .4s var(--ease), color .4s var(--ease)}
img,svg,video{max-width:100%; display:block}
img{height:auto}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:var(--sel)}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:2px}
[hidden]{display:none !important}
.sr-only{position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.skip{position:fixed; left:1rem; top:-4rem; z-index:999; background:var(--ink); color:var(--bg); padding:.6rem 1rem; font-family:var(--f-sans); font-size:.85rem; text-decoration:none; transition:top .2s}
.skip:focus{top:1rem}

/* ---------- 2. Typography ---------- */
h1,h2,h3,h4,h5{font-family:var(--f-display); font-weight:500; line-height:1.1; letter-spacing:-.01em; margin:0; text-wrap:balance}
p{margin:0 0 1em; text-wrap:pretty}
.t-display{font-family:var(--f-display); font-size:clamp(3rem, 1.6rem + 7vw, 7.6rem); line-height:.92; letter-spacing:-.025em; font-weight:400}
.t-h1{font-size:clamp(2.3rem, 1.6rem + 3.2vw, 4.4rem); line-height:1.02}
.t-h2{font-size:clamp(1.7rem, 1.3rem + 1.6vw, 2.6rem)}
.t-h3{font-size:clamp(1.3rem, 1.15rem + .7vw, 1.7rem); line-height:1.2}
.t-lede{font-size:clamp(1.2rem, 1.05rem + .7vw, 1.55rem); line-height:1.45; color:var(--ink-2)}
.t-ui{font-family:var(--f-sans); font-size:.82rem; line-height:1.45; letter-spacing:.005em}
.t-meta{font-family:var(--f-sans); font-size:.78rem; color:var(--muted); letter-spacing:.01em}
.t-mono{font-family:var(--f-mono); font-size:.8em; letter-spacing:0}
.t-label{font-family:var(--f-sans); font-size:.76rem; font-weight:500; color:var(--muted); letter-spacing:.02em}
.t-italic{font-style:italic}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.link{color:var(--ink); text-decoration:underline; text-decoration-color:color-mix(in oklab, var(--accent) 55%, transparent); text-decoration-thickness:1px; text-underline-offset:.2em; transition:text-decoration-color .2s, color .2s}
.link:hover{color:var(--accent); text-decoration-color:var(--accent)}
.quiet-link{text-decoration:none}
.quiet-link:hover .ttl,.quiet-link:hover.ttl{color:var(--accent)}
.meta-row{display:flex; flex-wrap:wrap; gap:.35rem 1.1rem; align-items:baseline}
.meta-row > *{white-space:nowrap}

/* ---------- 3. Layout & chrome ---------- */
.wrap{width:100%; max-width:calc(var(--wide) + 2 * var(--gutter)); margin-inline:auto; padding-inline:var(--gutter)}
.measure{max-width:var(--measure)}
.center{margin-inline:auto}
.stack > * + *{margin-top:var(--s4)}
.split{display:grid; gap:var(--s6)}
@media (min-width:900px){ .split{grid-template-columns:minmax(0,1fr) minmax(0,2.2fr)} }
.rule{border:0; border-top:1px solid var(--rule); margin:0}
.view{min-height:70vh; padding-bottom:var(--s8)}
.view-enter{animation:viewIn .55s var(--ease) both}
@keyframes viewIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

.progress{position:fixed; inset:0 0 auto 0; height:2px; z-index:60; pointer-events:none}
.progress span{display:block; height:100%; width:100%; background:var(--accent); transform-origin:0 50%; transform:scaleX(0)}

.site-header{position:sticky; top:0; z-index:40; background:color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter:saturate(1.2) blur(10px); -webkit-backdrop-filter:saturate(1.2) blur(10px);
  border-bottom:1px solid transparent; transition:border-color .3s, transform .35s var(--ease), background-color .4s}
.site-header.scrolled{border-bottom-color:var(--rule)}
.site-header.hide{transform:translateY(-100%)}
.hdr{display:flex; align-items:center; gap:var(--s5); min-height:var(--header-h)}
.brand{font-family:var(--f-display); font-size:1.45rem; line-height:1; text-decoration:none; letter-spacing:-.01em; white-space:nowrap; display:flex; flex-direction:column; gap:.2rem}
.brand small{font-family:var(--f-sans); font-size:.68rem; letter-spacing:.02em; color:var(--muted)}
.nav{display:flex; gap:.15rem; margin-left:auto; flex-wrap:wrap}
.nav a{font-family:var(--f-sans); font-size:.86rem; text-decoration:none; color:var(--ink-2); padding:.45rem .65rem; border-radius:999px; position:relative; transition:color .2s}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::after{content:""; position:absolute; left:.65rem; right:.65rem; bottom:.22rem; height:1px; background:var(--accent)}
.hdr-actions{display:flex; gap:.25rem; align-items:center}
.icon-btn{display:inline-grid; place-items:center; width:2.35rem; height:2.35rem; border-radius:999px; border:1px solid transparent; background:transparent; color:var(--ink-2); transition:background-color .2s, color .2s, border-color .2s}
.icon-btn:hover{background:var(--bg-2); color:var(--ink)}
.icon-btn svg{width:1.1rem; height:1.1rem}
.kbd{font-family:var(--f-mono); font-size:.68rem; border:1px solid var(--rule); border-bottom-width:2px; border-radius:4px; padding:.05rem .35rem; color:var(--muted); background:var(--surface)}
.menu-btn{display:none}
@media (max-width:880px){
  .nav{display:none}
  .menu-btn{display:inline-grid}
  .search-hint{display:none}
}
.mobile-nav{position:fixed; inset:0; z-index:70; background:var(--bg); display:flex; flex-direction:column; padding:calc(var(--header-h) + 1rem) var(--gutter) 2rem; transform:translateY(-102%); transition:transform .45s var(--ease); visibility:hidden}
.mobile-nav.open{transform:none; visibility:visible}
.mobile-nav a{font-family:var(--f-display); font-size:clamp(2rem, 9vw, 3rem); text-decoration:none; padding:.3rem 0; border-bottom:1px solid var(--rule); line-height:1.2}
.mobile-nav .close{position:absolute; top:1rem; right:var(--gutter)}

.site-footer{border-top:1px solid var(--rule); padding:var(--s7) 0 var(--s6); margin-top:var(--s7); font-family:var(--f-sans); font-size:.86rem; color:var(--ink-2)}
.ft-grid{display:grid; gap:var(--s6)}
@media (min-width:760px){ .ft-grid{grid-template-columns:2fr 1fr 1fr} }
.ft-name{font-family:var(--f-display); font-size:2rem; color:var(--ink); line-height:1}
.ft-list{list-style:none; padding:0; margin:0; display:grid; gap:.35rem}
.ft-list a{text-decoration:none; color:var(--ink-2)} .ft-list a:hover{color:var(--accent)}
.ft-base{display:flex; flex-wrap:wrap; gap:1rem; justify-content:space-between; margin-top:var(--s6); padding-top:var(--s4); border-top:1px solid var(--rule); color:var(--muted); font-size:.78rem}
.ft-base button{background:none; border:0; padding:0; color:var(--muted); text-decoration:underline; text-underline-offset:.2em; font-size:inherit}

/* ---------- 4. Components ---------- */
.btn{display:inline-flex; align-items:center; gap:.5rem; font-family:var(--f-sans); font-size:.86rem; font-weight:500; line-height:1; padding:.78rem 1.15rem; border-radius:999px; border:1px solid var(--ink); background:var(--ink); color:var(--bg); text-decoration:none; transition:background-color .2s, color .2s, border-color .2s, transform .15s}
.btn:hover{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn:active{transform:translateY(1px)}
.btn svg{width:1rem; height:1rem}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--rule-strong)}
.btn-ghost:hover{background:var(--bg-2); color:var(--ink); border-color:var(--ink)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45; pointer-events:none}
.chips{display:flex; flex-wrap:wrap; gap:.4rem}
.chip{font-family:var(--f-sans); font-size:.8rem; padding:.42rem .8rem; border-radius:999px; border:1px solid var(--rule); background:transparent; color:var(--ink-2); transition:all .2s}
.chip:hover{border-color:var(--ink-2); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip .n{opacity:.6; margin-left:.3rem; font-variant-numeric:tabular-nums}
.tag{font-family:var(--f-sans); font-size:.76rem; color:var(--ink-2); text-decoration:none; border-bottom:1px solid var(--rule); padding-bottom:1px}
.tag:hover{color:var(--accent); border-color:var(--accent)}
.tags{display:flex; flex-wrap:wrap; gap:.4rem .9rem}
.badge{display:inline-flex; align-items:center; gap:.35rem; font-family:var(--f-sans); font-size:.72rem; font-weight:500; padding:.2rem .55rem; border-radius:999px; background:var(--bg-2); color:var(--ink-2); white-space:nowrap}
.badge .dot{width:.42rem; height:.42rem; border-radius:50%; background:currentColor}
.badge.example{background:transparent; border:1px dashed var(--rule-strong); color:var(--muted)}
.badge.s-seedling{color:#6D7A2E} .badge.s-growing{color:#3D6B4F} .badge.s-evergreen{color:#24543B}
.badge.s-active,.badge.s-ongoing{color:#8A5A12}
[data-mode="dark"] .badge.s-seedling{color:#C9D58A} [data-mode="dark"] .badge.s-growing,[data-mode="dark"] .badge.s-evergreen,[data-mode="dark"] .badge.s-completed,[data-mode="dark"] .badge.s-finished{color:#93CDA8} [data-mode="dark"] .badge.s-active,[data-mode="dark"] .badge.s-ongoing{color:#E4B872} .badge.s-completed,.badge.s-finished{color:#2F5D46} .badge.s-planned{color:var(--muted)}
.input,.select,.textarea{width:100%; font-family:var(--f-sans); font-size:.92rem; padding:.7rem .85rem; border:1px solid var(--rule-strong); border-radius:8px; background:var(--surface); color:var(--ink); transition:border-color .2s, box-shadow .2s}
.input:focus,.select:focus,.textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search-field{position:relative}
.search-field svg{position:absolute; left:.85rem; top:50%; transform:translateY(-50%); width:1rem; color:var(--muted); pointer-events:none}
.search-field .input{padding-left:2.4rem; border-radius:999px}
.toolbar-row{display:flex; flex-wrap:wrap; gap:var(--s4); align-items:center; justify-content:space-between; padding:var(--s4) 0; border-block:1px solid var(--rule); margin-bottom:var(--s6)}
.empty{padding:var(--s7) 0; text-align:center; color:var(--muted)}
.empty h3{font-family:var(--f-display); font-size:1.7rem; color:var(--ink-2); margin-bottom:.4rem; font-weight:400; font-style:italic}
.empty p{font-family:var(--f-sans); font-size:.88rem; max-width:28rem; margin-inline:auto}
.loading{display:grid; place-items:center; min-height:60vh}
.loading span{width:2.4rem; height:1px; background:var(--ink); animation:loadPulse 1.2s var(--ease) infinite}
@keyframes loadPulse{0%{transform:scaleX(.1); opacity:.3} 50%{transform:scaleX(1); opacity:1} 100%{transform:scaleX(.1); opacity:.3}}

.toasts{position:fixed; bottom:1.25rem; left:50%; transform:translateX(-50%); z-index:200; display:grid; gap:.5rem; justify-items:center; pointer-events:none}
.toast{font-family:var(--f-sans); font-size:.85rem; background:var(--ink); color:var(--bg); padding:.7rem 1.1rem; border-radius:999px; box-shadow:0 10px 30px -10px rgba(0,0,0,.35); animation:toastIn .35s var(--ease) both; pointer-events:auto; max-width:min(90vw, 34rem)}
.toast.err{background:#8C2A2A; color:#FFF6F0}
@keyframes toastIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

.modal-back{position:fixed; inset:0; z-index:150; background:color-mix(in oklab, var(--ink) 35%, transparent); display:grid; place-items:start center; padding:12vh 1rem 1rem; animation:fadeIn .2s both; overflow:auto}
@keyframes fadeIn{from{opacity:0}}
.modal{width:min(36rem, 100%); background:var(--surface); color:var(--ink); border:1px solid var(--rule); border-radius:14px; box-shadow:0 30px 80px -20px rgba(0,0,0,.4); animation:modalIn .3s var(--ease) both; font-family:var(--f-sans)}
@keyframes modalIn{from{opacity:0; transform:translateY(-8px) scale(.985)}}
.modal-hd{padding:1.1rem 1.3rem .4rem; font-weight:600; font-size:1rem}
.modal-bd{padding:.6rem 1.3rem 1rem; font-size:.9rem; color:var(--ink-2)}
.modal-bd .input,.modal-bd .textarea{margin-top:.4rem}
.modal-ft{display:flex; justify-content:flex-end; gap:.5rem; padding:.9rem 1.3rem 1.2rem}
.modal .btn{font-size:.82rem; padding:.65rem 1rem}

.palette{width:min(40rem, 100%); padding:0; overflow:hidden}
.palette input{width:100%; border:0; border-bottom:1px solid var(--rule); background:transparent; padding:1.1rem 1.25rem; font-size:1.05rem; font-family:var(--f-sans); outline:none}
.palette ul{list-style:none; margin:0; padding:.4rem; max-height:min(55vh, 26rem); overflow:auto}
.palette li{display:flex; align-items:center; gap:.8rem; padding:.62rem .8rem; border-radius:8px; cursor:pointer; font-size:.9rem}
.palette li[aria-selected="true"]{background:var(--bg-2)}
.palette li .k{margin-left:auto; font-size:.72rem; color:var(--muted)}
.palette li .ty{font-size:.7rem; color:var(--muted); width:4.5rem; flex:none}
.palette .grp{font-size:.7rem; color:var(--muted); padding:.6rem .8rem .2rem; cursor:default}
.palette .foot{display:flex; gap:1rem; padding:.6rem 1rem; border-top:1px solid var(--rule); font-size:.72rem; color:var(--muted)}

.to-top{position:fixed; right:1.2rem; bottom:1.2rem; z-index:30; opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .3s, transform .3s; background:var(--surface); border:1px solid var(--rule)}
.to-top.show{opacity:1; transform:none; pointer-events:auto}

.cover-art{position:relative; overflow:hidden; background:var(--bg-2); aspect-ratio:4/3}
.cover-art img,.cover-art svg{width:100%; height:100%; object-fit:cover}
.cover-art.r-wide{aspect-ratio:16/9} .cover-art.r-square{aspect-ratio:1} .cover-art.r-tall{aspect-ratio:3/4}
.img-fade{opacity:0; transition:opacity .6s var(--ease)} .img-fade.loaded{opacity:1}

/* Book covers */
.book{display:grid; gap:.6rem; text-decoration:none}
.book-cover{aspect-ratio:2/3; position:relative; border-radius:2px 5px 5px 2px; overflow:hidden; box-shadow:0 1px 0 rgba(0,0,0,.08), 0 14px 24px -16px rgba(0,0,0,.45); transition:transform .4s var(--ease), box-shadow .4s}
.book:hover .book-cover{transform:translateY(-4px) rotate(-.4deg); box-shadow:0 1px 0 rgba(0,0,0,.08), 0 22px 30px -18px rgba(0,0,0,.5)}
.book-cover img{width:100%; height:100%; object-fit:cover}
.book-cover .gen{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; padding:14% 12%; color:#F5EFE3}
.book-cover .gen::before{content:""; position:absolute; left:6%; top:0; bottom:0; width:1px; background:rgba(255,255,255,.18)}
.book-cover .gen b{font-family:var(--f-display); font-weight:500; font-size:clamp(.95rem, .8rem + .6vw, 1.25rem); line-height:1.1}
.book-cover .gen i{font-family:var(--f-sans); font-style:normal; font-size:.66rem; letter-spacing:.04em; opacity:.8}
.book .ttl{font-family:var(--f-display); font-size:1.08rem; line-height:1.2; color:var(--ink)}
.book .by{font-family:var(--f-sans); font-size:.76rem; color:var(--muted)}
.shelf{display:grid; grid-template-columns:repeat(auto-fill, minmax(8.2rem, 1fr)); gap:var(--s6) var(--s5); padding-bottom:var(--s5); border-bottom:1px solid var(--rule-strong); position:relative}
.shelf::after{content:""; position:absolute; left:0; right:0; bottom:-6px; height:5px; background:linear-gradient(var(--rule), transparent); opacity:.6}

/* Section heads */
.sec{padding-top:var(--s8)}
.sec-hd{display:flex; align-items:baseline; justify-content:space-between; gap:1rem; padding-bottom:var(--s3); margin-bottom:var(--s5); border-bottom:1px solid var(--rule)}
.sec-hd h2{font-size:clamp(1.55rem, 1.2rem + 1.3vw, 2.2rem)}
.sec-hd .more{font-family:var(--f-sans); font-size:.82rem; text-decoration:none; color:var(--ink-2); white-space:nowrap}
.sec-hd .more:hover{color:var(--accent)}
.page-hd{padding:var(--s8) 0 var(--s6)}
.page-hd h1{font-size:clamp(2.8rem, 1.8rem + 4.6vw, 6rem); line-height:.95; letter-spacing:-.02em; font-weight:400}
.page-hd .t-lede{margin-top:var(--s4); max-width:38rem}

/* ---------- List variants (theme-selected) ---------- */
/* editorial */
.lv-editorial{display:grid; gap:var(--s6)}
@media (min-width:820px){ .lv-editorial{grid-template-columns:repeat(12, minmax(0,1fr)); column-gap:var(--s6)}
  .lv-editorial > .ent{grid-column:span 4}
  .lv-editorial > .ent.lead{grid-column:span 12; display:grid; grid-template-columns:1.25fr 1fr; gap:var(--s6); align-items:end; padding-bottom:var(--s6); border-bottom:1px solid var(--rule)}
  .lv-editorial.cols-2 > .ent{grid-column:span 6}
}
.ent{text-decoration:none; display:block; color:inherit}
.ent .ttl{font-family:var(--f-display); font-size:clamp(1.35rem, 1.1rem + .8vw, 1.75rem); line-height:1.12; transition:color .2s; display:block}
.ent.lead .ttl{font-size:clamp(2rem, 1.4rem + 2.6vw, 3.4rem); line-height:1.02}
.ent .dek{color:var(--ink-2); margin:.5rem 0 0; font-size:1.02rem; line-height:1.5}
.ent .meta-row{margin-top:.7rem}
.ent .cover-art{margin-bottom:var(--s4)}
.ent:hover .ttl{color:var(--accent)}
/* rows */
.lv-rows{list-style:none; margin:0; padding:0; counter-reset:row}
.lv-rows > li{border-bottom:1px solid var(--rule)}
.lv-rows .row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.3rem 1.5rem; padding:var(--s4) 0; text-decoration:none; align-items:baseline}
.lv-rows .row .ttl{font-family:var(--f-display); font-size:1.32rem; line-height:1.2; transition:color .2s}
.lv-rows .row:hover .ttl{color:var(--accent)}
.lv-rows .row .dek{grid-column:1; color:var(--ink-2); font-size:.98rem; margin:0}
.lv-rows .row .side{grid-row:1; grid-column:2; text-align:right}
/* toc */
.lv-toc{list-style:none; margin:0; padding:0}
.lv-toc a{display:flex; align-items:baseline; gap:.6rem; text-decoration:none; padding:.55rem 0}
.lv-toc .ttl{font-family:var(--f-display); font-size:1.3rem}
.lv-toc .lead-dots{flex:1; border-bottom:1px dotted var(--rule-strong); transform:translateY(-.3rem); min-width:2rem}
.lv-toc .pg{font-family:var(--f-serif); font-style:italic; color:var(--muted); font-size:.95rem; white-space:nowrap}
.lv-toc .dek{display:block; font-size:.95rem; color:var(--muted); margin:-.25rem 0 .4rem 0; font-style:italic}
.lv-toc a:hover .ttl{color:var(--accent)}
/* grid */
.lv-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(15rem, 1fr)); border-top:1px solid var(--ink); border-left:1px solid var(--rule)}
.lv-grid .cell{border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:var(--s4); min-height:12rem; display:flex; flex-direction:column; gap:.6rem; text-decoration:none; transition:background-color .2s}
.lv-grid .cell:hover{background:var(--bg-2)}
.lv-grid .cell .ttl{font-family:var(--f-display); font-size:1.3rem; line-height:1.15}
.lv-grid .cell .dek{font-size:.92rem; color:var(--ink-2); margin:0}
.lv-grid .cell .meta-row{margin-top:auto}
/* index (table) */
.lv-index{width:100%; border-collapse:collapse; font-family:var(--f-sans); font-size:.9rem}
.lv-index th{text-align:left; font-weight:500; font-size:.72rem; color:var(--muted); padding:.5rem .6rem; border-bottom:1px solid var(--ink)}
.lv-index td{padding:.75rem .6rem; border-bottom:1px solid var(--rule); vertical-align:baseline}
.lv-index tr{transition:background-color .15s}
.lv-index tbody tr:hover{background:var(--bg-2)}
.lv-index .no{font-family:var(--f-mono); color:var(--muted); font-size:.78rem; width:4.5rem}
.lv-index .ttl a{font-family:var(--f-display); font-size:1.12rem; text-decoration:none}
.lv-index .ttl a:hover{color:var(--accent)}
.lv-index .dt{font-family:var(--f-mono); font-size:.76rem; color:var(--muted); white-space:nowrap}
@media (max-width:640px){ .lv-index .hide-sm{display:none} }
/* stack */
.lv-stack{list-style:none; margin:0; padding:0}
.lv-stack a{display:grid; grid-template-columns:minmax(0,1fr); gap:.4rem; text-decoration:none; padding:var(--s5) 0; border-top:1px solid var(--ink)}
.lv-stack .ttl{font-family:var(--f-display); font-size:clamp(1.9rem, 1.2rem + 3vw, 3.6rem); line-height:1; letter-spacing:-.025em; transition:transform .45s var(--ease), color .2s}
.lv-stack a:hover .ttl{transform:translateX(.6rem); color:var(--accent)}
@media (min-width:820px){ .lv-stack a{grid-template-columns:9rem minmax(0,1fr) 16rem; align-items:baseline} .lv-stack .dek{margin:0} }
/* visual */
.lv-visual{display:grid; gap:var(--s7) var(--s6)}
@media (min-width:760px){ .lv-visual{grid-template-columns:repeat(6, minmax(0,1fr))}
  .lv-visual > a{grid-column:span 3} .lv-visual > a:nth-child(3n+1){grid-column:span 6} .lv-visual > a:nth-child(3n+1) .cover-art{aspect-ratio:21/9} }
.lv-visual a{text-decoration:none; display:block}
.lv-visual .cover-art{margin-bottom:var(--s4); transition:filter .5s}
.lv-visual .cover-art img,.lv-visual .cover-art svg{transition:transform 1.2s var(--ease)}
.lv-visual a:hover .cover-art img,.lv-visual a:hover .cover-art svg{transform:scale(1.03)}
.lv-visual .ttl{font-family:var(--f-display); font-size:clamp(1.4rem, 1.1rem + 1vw, 2rem); line-height:1.1}
.lv-visual .dek{color:var(--ink-2); margin:.4rem 0 0}

/* ---------- 5. Prose ---------- */
.prose{font-family:var(--f-serif); font-size:var(--body-size); line-height:var(--body-lh); color:var(--ink); max-width:var(--measure); hanging-punctuation:first}
.prose > * + *{margin-top:1.05em}
.prose p{margin:0}
.prose h2,.prose h3,.prose h4{font-family:var(--f-display); scroll-margin-top:calc(var(--header-h) + 1.5rem)}
.prose h2{font-size:1.75em; margin-top:2em; line-height:1.15}
.prose h3{font-size:1.32em; margin-top:1.8em; line-height:1.2}
.prose h4{font-family:var(--f-sans); font-size:.8em; font-weight:600; letter-spacing:.02em; margin-top:1.8em; color:var(--ink-2)}
.prose h2 + *, .prose h3 + *, .prose h4 + *{margin-top:.6em}
.prose a{color:inherit; text-decoration:underline; text-decoration-color:color-mix(in oklab, var(--accent) 60%, transparent); text-decoration-thickness:1px; text-underline-offset:.18em}
.prose a:hover{color:var(--accent)}
.prose strong,.prose b{font-weight:600}
.prose ul,.prose ol{padding-left:1.3em}
.prose li + li{margin-top:.35em}
.prose li::marker{color:var(--muted)}
.prose blockquote{margin-inline:0; padding:0 0 0 1.3em; border-left:2px solid var(--accent); font-style:italic; color:var(--ink-2)}
.prose blockquote cite{display:block; font-style:normal; font-family:var(--f-sans); font-size:.75em; color:var(--muted); margin-top:.6em}
.prose blockquote cite::before{content:"— "}
.prose hr{border:0; height:1.6em; margin-block:2.2em; text-align:center}
.prose hr::before{content:"⁂"; color:var(--muted); font-size:1.1em; letter-spacing:.5em}
.prose code{font-family:var(--f-mono); font-size:.82em; background:var(--bg-2); padding:.1em .35em; border-radius:4px}
.prose pre{font-family:var(--f-mono); font-size:.78rem; line-height:1.65; background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:1.1rem 1.2rem; overflow:auto; position:relative; tab-size:4}
.prose pre code{background:none; padding:0; font-size:inherit; display:block}
.prose pre .ln{display:block; min-height:1.65em; white-space:pre}
.prose pre[data-lang]::before{content:attr(data-lang); position:absolute; top:.5rem; right:.8rem; font-family:var(--f-sans); font-size:.65rem; color:var(--muted)}
.prose .copy-code{position:absolute; bottom:.5rem; right:.6rem; font-family:var(--f-sans); font-size:.68rem; border:1px solid var(--rule); background:var(--bg); color:var(--muted); border-radius:6px; padding:.2rem .5rem; opacity:0; transition:opacity .2s}
.prose pre:hover .copy-code,.prose .copy-code:focus{opacity:1}
.prose figure{margin-inline:0}
.prose figure img{border-radius:var(--radius); width:100%}
.prose figcaption{font-family:var(--f-sans); font-size:.78rem; color:var(--muted); margin-top:.7rem; line-height:1.5}
@media (min-width:1000px){
  .prose .fig-wide{margin-inline:calc((var(--measure) - min(56rem, 92vw)) / 2); }
  .prose .fig-full{margin-inline:calc(50% - 50vw + var(--gutter)); max-width:none}
}
.prose .math-display{overflow-x:auto; overflow-y:hidden; padding:.4em 0; text-align:center}
.prose .math-display.raw,.math-raw{font-family:var(--f-mono); font-size:.85em; color:var(--ink-2); white-space:pre-wrap}
.prose .table-wrap{overflow-x:auto}
.prose table{border-collapse:collapse; width:100%; font-family:var(--f-sans); font-size:.82em}
.prose th,.prose td{border-bottom:1px solid var(--rule); padding:.55em .7em; text-align:left; vertical-align:top}
.prose th{font-weight:600; border-bottom-color:var(--ink-2)}
.prose .aside-note{font-family:var(--f-sans); font-size:.8em; line-height:1.55; color:var(--ink-2); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:.8em 0}
@media (min-width:1240px){ .has-margin .prose .aside-note{float:right; clear:right; width:13rem; margin-right:-16rem; margin-top:.2em; border:0; padding:0} }
.prose .fnref a{font-family:var(--f-sans); font-size:.68em; text-decoration:none; color:var(--accent); padding:0 .1em}
.prose .sidenote{display:none}
.prose .wikilink{text-decoration-style:dotted}
.prose .wikilink.missing{color:var(--muted); text-decoration:line-through dotted}
.prose mark{background:color-mix(in oklab, var(--accent) 18%, transparent); color:inherit; padding:0 .1em}
.footnotes{margin-top:3em; padding-top:1.2em; border-top:1px solid var(--rule); font-size:.85em; color:var(--ink-2); max-width:var(--measure)}
.footnotes ol{padding-left:1.2em; margin:0}
.footnotes li + li{margin-top:.5em}
.footnotes .back{text-decoration:none; color:var(--accent); font-family:var(--f-sans); margin-left:.3em}
.prose .drop::first-letter{float:left; font-family:var(--f-display); font-size:4.2em; line-height:.82; padding:.06em .1em 0 0; color:var(--accent)}

/* Code token colours */
.tk-k{color:var(--accent)} .tk-s{color:color-mix(in oklab, var(--accent-2) 85%, var(--ink))} .tk-c{color:var(--muted); font-style:italic}
.tk-n{color:#9A5B12} .tk-f{color:var(--ink); font-weight:500} .tk-o{color:var(--ink-2)}
[data-mode="dark"] .tk-n{color:#E0AE6A}

/* ---------- 6. Page-specific ---------- */
/* Article */
.article-hd{padding:var(--s8) 0 var(--s6); max-width:52rem}
.article-hd .crumbs{margin-bottom:var(--s5)}
.article-hd h1{font-size:clamp(2.5rem, 1.6rem + 4vw, 5rem); line-height:1; letter-spacing:-.02em; font-weight:400}
.article-hd .sub{font-family:var(--f-display); font-style:italic; font-size:clamp(1.3rem, 1.1rem + 1vw, 1.9rem); line-height:1.3; color:var(--ink-2); margin-top:var(--s4); font-weight:400}
.article-hd .meta-row{margin-top:var(--s5)}
.article-cover{margin:0 0 var(--s7)}
.article-cover .cover-art{aspect-ratio:21/9}
.article-cover figcaption{font-family:var(--f-sans); font-size:.76rem; color:var(--muted); margin-top:.6rem}
.article-body{display:grid; gap:var(--s6); position:relative}
@media (min-width:1100px){ .article-body{grid-template-columns:minmax(0, var(--measure)) minmax(0,1fr); column-gap:clamp(3rem, 6vw, 6rem)} }
.toc{font-family:var(--f-sans); font-size:.8rem; align-self:start}
@media (min-width:1100px){ .toc{position:sticky; top:calc(var(--header-h) + 1.5rem); grid-column:2; grid-row:1; max-width:15rem} }
@media (max-width:1099px){ .toc{border:1px solid var(--rule); border-radius:10px; padding:1rem 1.1rem} }
.toc b{display:block; font-weight:500; color:var(--muted); margin-bottom:.6rem}
.toc ol{list-style:none; margin:0; padding:0; display:grid; gap:.45rem; border-left:1px solid var(--rule)}
.toc a{text-decoration:none; color:var(--ink-2); display:block; padding-left:.85rem; margin-left:-1px; border-left:1px solid transparent; line-height:1.35; transition:color .2s, border-color .2s}
.toc a.lvl-3{padding-left:1.6rem; font-size:.95em}
.toc a.active,.toc a:hover{color:var(--ink); border-left-color:var(--accent)}
.article-end{max-width:var(--measure); margin-top:var(--s7); padding-top:var(--s5); border-top:1px solid var(--rule); display:grid; gap:var(--s5)}
.share{display:flex; flex-wrap:wrap; gap:.5rem}
.share .btn{font-size:.78rem; padding:.55rem .9rem}
.author-card{display:flex; gap:1rem; align-items:center; font-family:var(--f-sans); font-size:.86rem; color:var(--ink-2)}
.author-card .av{width:3rem; height:3rem; border-radius:50%; background:var(--bg-2); display:grid; place-items:center; font-family:var(--f-display); font-size:1.3rem; color:var(--ink); overflow:hidden; flex:none}
.author-card .av img{width:100%; height:100%; object-fit:cover}
.refs{max-width:var(--measure); font-size:.92rem}
.refs h2{font-family:var(--f-sans); font-size:.82rem; font-weight:600; color:var(--muted); margin-bottom:.8rem}
.refs ol{padding-left:1.6rem; margin:0; display:grid; gap:.6rem; color:var(--ink-2)}
.related{margin-top:var(--s8)}
.pager{display:grid; grid-template-columns:1fr 1fr; gap:var(--s5); margin-top:var(--s7); border-top:1px solid var(--rule); padding-top:var(--s5)}
.pager a{text-decoration:none} .pager .nx{text-align:right}
.pager .ttl{font-family:var(--f-display); font-size:1.25rem; display:block; margin-top:.3rem}
.pager a:hover .ttl{color:var(--accent)}

/* Home */
.hero{padding-block:var(--s8) var(--s7); position:relative}
.hero-name{font-family:var(--f-display); font-weight:400; font-size:clamp(3.4rem, 1.4rem + 8.6vw, 9.5rem); line-height:.88; letter-spacing:-.035em}
.hero-tag{font-family:var(--f-display); font-style:italic; font-size:clamp(1.3rem, 1rem + 1.3vw, 2.1rem); color:var(--ink-2); margin-top:var(--s5); line-height:1.25; max-width:34ch}
.hero-intro{max-width:34rem; margin-top:var(--s6); font-size:1.1em; color:var(--ink-2)}
.hero-links{display:flex; flex-wrap:wrap; gap:.6rem; margin-top:var(--s6)}
.now{display:grid; gap:0; border-top:1px solid var(--rule)}
.now-row{display:grid; grid-template-columns:8rem minmax(0,1fr); gap:1rem; padding:var(--s4) 0; border-bottom:1px solid var(--rule); align-items:baseline}
.now-row dt{font-family:var(--f-sans); font-size:.8rem; color:var(--muted)}
.now-row dd{margin:0; font-size:1.08rem}
.quote-block{max-width:44rem; margin:0}
.quote-block p{font-family:var(--f-display); font-size:clamp(1.6rem, 1.2rem + 1.6vw, 2.6rem); line-height:1.2; font-style:italic; margin:0}
.quote-block footer{font-family:var(--f-sans); font-size:.82rem; color:var(--muted); margin-top:var(--s4)}
.interests{display:flex; flex-wrap:wrap; gap:.25rem 0; font-family:var(--f-display); font-size:clamp(1.25rem, 1rem + 1vw, 1.8rem); line-height:1.35}
.interests span:not(:last-child)::after{content:"/"; color:var(--rule-strong); margin:0 .55em; font-style:normal}

/* Research detail */
.paper-hd{padding:var(--s8) 0 var(--s5); text-align:left; max-width:52rem}
.paper-hd h1{font-size:clamp(2.2rem, 1.5rem + 3vw, 4rem); line-height:1.05; font-weight:400}
.abstract{max-width:var(--measure); margin:var(--s5) 0 var(--s6); padding:var(--s4) 0; border-block:1px solid var(--rule)}
.abstract b{font-family:var(--f-sans); font-size:.76rem; font-weight:600; color:var(--muted); display:block; margin-bottom:.4rem}
.abstract p{margin:0; font-size:1.02em}
.facts{display:grid; grid-template-columns:repeat(auto-fit, minmax(10rem,1fr)); gap:var(--s4) var(--s5); font-family:var(--f-sans); font-size:.85rem; margin:var(--s5) 0 0; max-width:52rem}
.facts dt{font-size:.72rem; color:var(--muted); margin-bottom:.2rem}
.facts dd{margin:0; color:var(--ink)}
.timeline{list-style:none; margin:0; padding:0; border-left:1px solid var(--rule); max-width:var(--measure)}
.timeline li{position:relative; padding:0 0 var(--s4) var(--s5)}
.timeline li::before{content:""; position:absolute; left:-4px; top:.55em; width:7px; height:7px; border-radius:50%; background:var(--bg); border:1px solid var(--accent)}
.timeline .when{font-family:var(--f-mono); font-size:.75rem; color:var(--muted); display:block}
.attach{display:flex; flex-wrap:wrap; gap:.5rem}

/* Notes / garden */
.garden{display:grid; gap:var(--s5); grid-template-columns:repeat(auto-fill, minmax(17rem,1fr))}
.note-card{display:flex; flex-direction:column; gap:.6rem; padding:var(--s5); background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); text-decoration:none; transition:border-color .25s, transform .35s var(--ease); min-height:12rem}
.note-card:hover{border-color:var(--rule-strong); transform:translateY(-2px)}
.note-card .ttl{font-family:var(--f-display); font-size:1.35rem; line-height:1.15}
.note-card .dek{font-size:.96rem; color:var(--ink-2); margin:0}
.note-card .meta-row{margin-top:auto}
.backlinks{max-width:var(--measure); margin-top:var(--s7); padding:var(--s5); background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius)}
.backlinks h2{font-family:var(--f-sans); font-size:.8rem; font-weight:600; color:var(--muted); margin-bottom:.8rem}
.backlinks ul{list-style:none; margin:0; padding:0; display:grid; gap:.6rem}
.backlinks a{text-decoration:none; font-family:var(--f-display); font-size:1.15rem} .backlinks a:hover{color:var(--accent)}
.backlinks p{margin:.15rem 0 0; font-size:.88rem; color:var(--muted)}

/* Projects */
.proj-list{display:grid; gap:var(--s8)}
.proj{display:grid; gap:var(--s5); text-decoration:none; align-items:center}
@media (min-width:860px){ .proj{grid-template-columns:repeat(12, minmax(0,1fr)); gap:var(--s6)}
  .proj .cover-art{grid-column:1 / span 7} .proj .txt{grid-column:8 / span 5}
  .proj:nth-child(even) .cover-art{grid-column:6 / span 7; grid-row:1} .proj:nth-child(even) .txt{grid-column:1 / span 5; grid-row:1} }
.proj .ttl{font-family:var(--f-display); font-size:clamp(1.7rem, 1.3rem + 1.6vw, 2.6rem); line-height:1.05; transition:color .2s}
.proj:hover .ttl{color:var(--accent)}
.proj .dek{color:var(--ink-2); margin:.6rem 0 1rem}
.stack-list{display:flex; flex-wrap:wrap; gap:.3rem}
.stack-list span{font-family:var(--f-mono); font-size:.72rem; color:var(--ink-2); border:1px solid var(--rule); border-radius:4px; padding:.12rem .45rem}
.gallery{display:grid; gap:var(--s4); grid-template-columns:repeat(auto-fill, minmax(16rem,1fr)); margin-top:var(--s6)}
.gallery figure{margin:0} .gallery img{border-radius:var(--radius); width:100%; aspect-ratio:16/10; object-fit:cover; cursor:zoom-in}
.gallery figcaption{font-family:var(--f-sans); font-size:.75rem; color:var(--muted); margin-top:.4rem}
.lightbox{position:fixed; inset:0; z-index:180; background:rgba(15,13,11,.92); display:grid; place-items:center; padding:2rem; animation:fadeIn .25s both; cursor:zoom-out}
.lightbox img{max-height:86vh; width:auto; border-radius:2px}
.lightbox p{color:#E8E1D4; font-family:var(--f-sans); font-size:.82rem; text-align:center; margin-top:.8rem}

/* Library */
.lib-stats{display:flex; flex-wrap:wrap; gap:var(--s6); font-family:var(--f-sans); font-size:.82rem; color:var(--muted); margin-top:var(--s5)}
.lib-stats b{display:block; font-family:var(--f-display); font-size:2.2rem; font-weight:400; color:var(--ink); line-height:1}
.passages{columns:2 20rem; column-gap:var(--s7)}
.passage{break-inside:avoid; margin:0 0 var(--s6); padding:0}
.passage p{font-family:var(--f-display); font-size:1.35rem; line-height:1.35; font-style:italic; margin:0}
.passage footer{font-family:var(--f-sans); font-size:.78rem; color:var(--muted); margin-top:.6rem}
.passage .note{font-family:var(--f-sans); font-size:.82rem; color:var(--ink-2); margin-top:.5rem; padding-left:.8rem; border-left:1px solid var(--accent)}
.book-hd{display:grid; gap:var(--s6); padding:var(--s8) 0 var(--s6); align-items:end}
@media (min-width:760px){ .book-hd{grid-template-columns:14rem minmax(0,1fr)} }
.book-hd .book-cover{width:min(14rem, 60vw)}
.rating{font-family:var(--f-sans); letter-spacing:.2em; color:var(--accent)}
.rating .off{color:var(--rule-strong)}

/* CV */
.cv{max-width:56rem}
.cv-hd{padding:var(--s8) 0 var(--s5); display:grid; gap:var(--s4)}
.cv-hd h1{font-size:clamp(2.6rem, 1.8rem + 3.6vw, 5rem); line-height:.95; font-weight:400}
.cv-contact{display:flex; flex-wrap:wrap; gap:.4rem 1.4rem; font-family:var(--f-sans); font-size:.85rem; color:var(--ink-2)}
.cv-contact a{text-decoration:none} .cv-contact a:hover{color:var(--accent)}
.cv-actions{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:var(--s3)}
.cv-sec{display:grid; gap:var(--s3) var(--s6); padding:var(--s5) 0; border-top:1px solid var(--rule)}
@media (min-width:760px){ .cv-sec{grid-template-columns:11rem minmax(0,1fr)} }
.cv-sec > h2{font-family:var(--f-sans); font-size:.8rem; font-weight:600; color:var(--accent); padding-top:.3rem; letter-spacing:.01em}
.cv-ent + .cv-ent{margin-top:var(--s5)}
.cv-ent .top{display:flex; flex-wrap:wrap; justify-content:space-between; gap:.2rem 1rem; align-items:baseline}
.cv-ent .ttl{font-family:var(--f-display); font-size:1.32rem; line-height:1.2}
.cv-ent .when{font-family:var(--f-mono); font-size:.76rem; color:var(--muted); white-space:nowrap}
.cv-ent .org{font-family:var(--f-sans); font-size:.86rem; color:var(--ink-2); margin-top:.15rem}
.cv-ent ul{margin:.5rem 0 0; padding-left:1.1rem; font-size:.98rem; color:var(--ink-2)}
.cv-ent ul li + li{margin-top:.2rem}
.cv-skills{display:grid; gap:.6rem}
.cv-skills div{display:grid; grid-template-columns:minmax(7rem, 10rem) 1fr; gap:1rem; font-size:.98rem}
.cv-skills b{font-family:var(--f-sans); font-size:.82rem; font-weight:500; color:var(--muted); padding-top:.15rem}
.cv-text{font-size:1.05rem; color:var(--ink-2); max-width:var(--measure)}
.cv-inline{display:flex; flex-wrap:wrap; gap:.3rem .9rem}

/* Contact */
.contact-email{font-family:var(--f-display); font-size:clamp(1.8rem, 1.2rem + 3vw, 3.6rem); line-height:1.1; word-break:break-word; display:flex; align-items:center; gap:1rem; flex-wrap:wrap}
.contact-email a{text-decoration:none} .contact-email a:hover{color:var(--accent)}
.socials{list-style:none; margin:var(--s6) 0 0; padding:0; border-top:1px solid var(--rule); max-width:40rem}
.socials li{border-bottom:1px solid var(--rule)}
.socials a{display:flex; justify-content:space-between; gap:1rem; padding:var(--s4) 0; text-decoration:none; font-size:1.15rem}
.socials a span:last-child{font-family:var(--f-sans); font-size:.82rem; color:var(--muted)}
.socials a:hover{color:var(--accent)}
.form-grid{display:grid; gap:var(--s4); max-width:36rem; margin-top:var(--s6); font-family:var(--f-sans)}
.form-grid label{font-size:.8rem; color:var(--ink-2); display:grid; gap:.35rem}

/* Search results */
.results{list-style:none; padding:0; margin:0}
.results li{padding:var(--s4) 0; border-bottom:1px solid var(--rule)}
.results a{text-decoration:none}
.results .ttl{font-family:var(--f-display); font-size:1.35rem} .results a:hover .ttl{color:var(--accent)}
.results p{margin:.3rem 0 0; color:var(--ink-2); font-size:.95rem}
.results mark{background:var(--sel); color:inherit}

/* 404 */
.nf{min-height:70vh; display:grid; align-content:center; gap:var(--s4)}
.nf .t-display{font-style:italic}

/* Reveal (single orchestrated home entrance) */
.reveal{opacity:0; transform:translateY(14px); transition:opacity .9s var(--ease), transform .9s var(--ease)}
.reveal.in{opacity:1; transform:none}
.reveal.d1{transition-delay:.08s} .reveal.d2{transition-delay:.18s} .reveal.d3{transition-delay:.3s} .reveal.d4{transition-delay:.42s}

/* Preview bar (theme preview & snapshot notices) */
.preview-bar{position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); z-index:120; display:flex; gap:.6rem; align-items:center; background:var(--ink); color:var(--bg); padding:.5rem .5rem .5rem 1.1rem; border-radius:999px; font-family:var(--f-sans); font-size:.82rem; box-shadow:0 18px 40px -12px rgba(0,0,0,.45); flex-wrap:wrap; justify-content:center; max-width:calc(100vw - 2rem)}
.preview-bar button{border:0; border-radius:999px; padding:.5rem .9rem; font-size:.78rem; font-weight:500; background:var(--bg); color:var(--ink)}
.preview-bar button.alt{background:transparent; color:var(--bg); border:1px solid color-mix(in oklab, var(--bg) 35%, transparent)}
.preview-bar select{background:transparent; color:var(--bg); border:1px solid color-mix(in oklab, var(--bg) 35%, transparent); border-radius:999px; padding:.4rem .6rem; font-size:.78rem}
.preview-bar select option{color:#111}

/* ---------- 7. Themes ----------
   Colours and fonts are applied as CSS variables by the theme engine (JS).
   The rules below change structure: navigation, hero composition, headings,
   list treatments and article presentation. */

/* 01 · Editorial — literary magazine masthead */
@media (min-width:881px){
  [data-theme="editorial"] .hdr{display:grid; grid-template-columns:1fr auto 1fr; row-gap:.1rem; column-gap:1rem; padding-top:1rem; padding-bottom:.2rem}
  [data-theme="editorial"] .brand{grid-column:2; grid-row:1; align-items:center; text-align:center; font-size:1.85rem}
  [data-theme="editorial"] .nav{grid-column:1 / -1; grid-row:2; margin-left:0; justify-self:center}
  [data-theme="editorial"] .hdr-actions{grid-column:3; grid-row:1; justify-self:end}
}
[data-theme="editorial"] .site-header:not(.scrolled){border-bottom:3px double var(--rule-strong)}
[data-theme="editorial"] .hero{text-align:center; padding-top:var(--s7)}
[data-theme="editorial"] .dateline{display:flex; justify-content:space-between; gap:1rem; font-family:var(--f-sans); font-size:.74rem; color:var(--muted); padding-bottom:var(--s3); border-bottom:1px solid var(--rule); margin-bottom:var(--s7)}
[data-theme="editorial"] .hero-name{font-size:clamp(3.6rem, 1rem + 10vw, 10.5rem)}
[data-theme="editorial"] .hero-tag{margin-inline:auto}
[data-theme="editorial"] .hero-intro{margin-inline:auto; text-align:left; columns:2 16rem; column-gap:var(--s6); max-width:44rem; border-top:1px solid var(--rule); padding-top:var(--s5)}
[data-theme="editorial"] .hero-intro p:first-child::first-letter{float:left; font-family:var(--f-display); font-size:3.7em; line-height:.8; padding:.07em .08em 0 0; color:var(--accent)}
[data-theme="editorial"] .hero-links{justify-content:center}
[data-theme="editorial"] .sec-hd{border-bottom:0; border-top:1px solid var(--ink); padding-top:var(--s3)}
[data-theme="editorial"] .sec-hd h2{font-style:italic; font-weight:400}
[data-theme="editorial"] .article-hd{text-align:center; margin-inline:auto}
[data-theme="editorial"] .article-hd .meta-row,[data-theme="editorial"] .article-hd .crumbs{justify-content:center}
[data-theme="editorial"] .prose > p:first-of-type::first-letter{float:left; font-family:var(--f-display); font-size:4.1em; line-height:.8; padding:.06em .1em 0 0; color:var(--accent)}

/* 02 · Academic — sidebar navigation, paper-like typesetting */
@media (min-width:1100px){
  [data-theme="academic"] .site-header{position:fixed; top:0; bottom:0; left:0; width:16rem; border-right:1px solid var(--rule); border-bottom:0; background:var(--bg); backdrop-filter:none}
  [data-theme="academic"] .site-header.hide{transform:none}
  [data-theme="academic"] .hdr{flex-direction:column; align-items:stretch; height:100%; padding:2rem 1.6rem; gap:2rem; max-width:none}
  [data-theme="academic"] .nav{flex-direction:column; margin-left:0; gap:0; counter-reset:navc}
  [data-theme="academic"] .nav a{border-radius:0; padding:.45rem 0; counter-increment:navc; display:flex; gap:.7rem; color:var(--ink-2)}
  [data-theme="academic"] .nav a::before{content:counter(navc); font-family:var(--f-mono); font-size:.72rem; color:var(--muted); width:1rem; padding-top:.1rem}
  [data-theme="academic"] .nav a[aria-current="page"]::after{left:auto; right:0; top:50%; bottom:auto; width:.4rem; height:.4rem; border-radius:50%}
  [data-theme="academic"] .hdr-actions{margin-top:auto}
  [data-theme="academic"] .site-body{margin-left:16rem}
  [data-theme="academic"] .progress{left:16rem}
}
[data-theme="academic"] .brand{font-family:var(--f-serif); font-weight:600; font-size:1.2rem}
[data-theme="academic"] h1,[data-theme="academic"] h2,[data-theme="academic"] h3{letter-spacing:0}
[data-theme="academic"] .hero{padding-top:var(--s8)}
[data-theme="academic"] .hero-name{font-family:var(--f-serif); font-size:clamp(2.4rem, 1.6rem + 3vw, 3.8rem); line-height:1.05; letter-spacing:-.01em; font-weight:400}
[data-theme="academic"] .affil{font-family:var(--f-serif); font-size:1.05rem; color:var(--ink-2); margin-top:var(--s3)}
[data-theme="academic"] .affil sup{font-size:.65em; color:var(--accent)}
[data-theme="academic"] .abstract-hero{max-width:42rem; margin-top:var(--s6); padding:var(--s4) 0 0; border-top:1px solid var(--ink)}
[data-theme="academic"] .abstract-hero b{font-family:var(--f-sans); font-size:.78rem; font-weight:600; display:block; margin-bottom:.4rem}
[data-theme="academic"] .abstract-hero p{text-align:justify; hyphens:auto}
[data-theme="academic"] .keywords{font-size:.95rem; color:var(--ink-2); margin-top:var(--s3)}
[data-theme="academic"] .keywords i{font-style:normal; font-family:var(--f-sans); font-size:.78rem; font-weight:600; color:var(--ink); margin-right:.4rem}
[data-theme="academic"] .view{counter-reset:secn}
[data-theme="academic"] .sec-hd h2{font-family:var(--f-serif); font-size:1.45rem; font-weight:600; counter-increment:secn}
[data-theme="academic"] .sec-hd h2::before{content:counter(secn) "\2003"; color:var(--accent)}
[data-theme="academic"] .lv-rows{counter-reset:row}
[data-theme="academic"] .lv-rows > li{border:0}
[data-theme="academic"] .lv-rows .row{grid-template-columns:2.4rem minmax(0,1fr) auto; padding:.65rem 0}
[data-theme="academic"] .lv-rows .row::before{content:"[" counter(row) "]"; counter-increment:row; font-family:var(--f-mono); font-size:.78rem; color:var(--accent); grid-row:1 / span 2; padding-top:.3rem}
[data-theme="academic"] .lv-rows .row .ttl{font-family:var(--f-serif); font-size:1.12rem; font-weight:600}
[data-theme="academic"] .lv-rows .row .dek{grid-column:2; font-size:.95rem}
[data-theme="academic"] .lv-rows .row .side{grid-column:3}
[data-theme="academic"] .lv-rows .row .meta-row{grid-column:2 !important}
[data-theme="academic"] .prose{counter-reset:h2c}
[data-theme="academic"] .prose h2{font-family:var(--f-serif); font-size:1.4em; font-weight:600; counter-increment:h2c; counter-reset:h3c}
[data-theme="academic"] .prose h2::before{content:counter(h2c) "\2002"; color:var(--accent)}
[data-theme="academic"] .prose h3{font-family:var(--f-serif); font-size:1.15em; font-weight:600; font-style:italic; counter-increment:h3c}
[data-theme="academic"] .prose h3::before{content:counter(h2c) "." counter(h3c) "\2002"; font-style:normal; color:var(--accent)}
[data-theme="academic"] .prose p{text-align:justify; hyphens:auto}
[data-theme="academic"] .article-hd h1,[data-theme="academic"] .page-hd h1,[data-theme="academic"] .paper-hd h1{font-family:var(--f-serif); font-weight:400; letter-spacing:-.01em}
[data-theme="academic"] .page-hd h1{font-size:clamp(2.2rem, 1.6rem + 2.4vw, 3.4rem)}
[data-theme="academic"] .prose figcaption::before{content:"Figure. "; font-weight:600; color:var(--ink)}
[data-theme="academic"] .note-card{border-radius:0; background:transparent; border-width:0 0 0 2px; border-color:var(--accent); min-height:0}

/* 03 · Monograph — book chapters, centred, marginal notes */
[data-theme="monograph"] .hdr{justify-content:center; flex-wrap:wrap; gap:.4rem 2rem; padding-block:.6rem}
[data-theme="monograph"] .brand{font-variant:small-caps; letter-spacing:.08em; font-size:1.25rem; text-transform:lowercase}
[data-theme="monograph"] .brand small{display:none}
[data-theme="monograph"] .nav{margin-left:0}
[data-theme="monograph"] .nav a{font-family:var(--f-serif); font-variant:small-caps; text-transform:lowercase; letter-spacing:.06em; font-size:1rem}
[data-theme="monograph"] .nav a[aria-current="page"]::after{display:none}
[data-theme="monograph"] .nav a[aria-current="page"]{font-style:italic}
[data-theme="monograph"] .wrap{max-width:calc(54rem + 2 * var(--gutter))}
[data-theme="monograph"] .hero{text-align:center; padding-block:var(--s9) var(--s7)}
[data-theme="monograph"] .prologue{font-variant:small-caps; text-transform:lowercase; letter-spacing:.14em; color:var(--muted); font-size:1rem}
[data-theme="monograph"] .hero-name{font-size:clamp(3rem, 1.6rem + 6vw, 6.8rem); margin-top:var(--s4); letter-spacing:-.02em}
[data-theme="monograph"] .hero-tag{margin-inline:auto}
[data-theme="monograph"] .epigraph{max-width:26rem; margin:var(--s7) auto 0; font-style:italic; color:var(--ink-2); font-size:1.05rem}
[data-theme="monograph"] .epigraph footer{font-style:normal; font-variant:small-caps; text-transform:lowercase; letter-spacing:.06em; color:var(--muted); margin-top:.4rem; font-size:.95rem}
[data-theme="monograph"] .hero-intro{margin-inline:auto; text-align:justify; hyphens:auto; margin-top:var(--s7)}
[data-theme="monograph"] .hero-intro p:first-child::first-letter{float:left; font-family:var(--f-display); font-size:3.6em; line-height:.8; padding:.07em .08em 0 0}
[data-theme="monograph"] .hero-links{justify-content:center}
[data-theme="monograph"] .view{counter-reset:chap}
[data-theme="monograph"] .sec-hd{flex-direction:column; align-items:center; text-align:center; border:0; gap:.4rem; margin-bottom:var(--s6)}
[data-theme="monograph"] .sec-hd h2{font-weight:400; font-size:clamp(1.8rem, 1.4rem + 1.4vw, 2.6rem)}
[data-theme="monograph"] .sec-hd h2::before{counter-increment:chap; content:"Chapter " counter(chap, upper-roman); display:block; font-family:var(--f-serif); font-size:.9rem; font-variant:small-caps; text-transform:lowercase; letter-spacing:.14em; color:var(--muted); margin-bottom:.6rem}
[data-theme="monograph"] .sec-hd::after{content:"❦"; color:var(--accent); font-size:1.1rem; margin-top:.5rem}
[data-theme="monograph"] .page-hd,[data-theme="monograph"] .article-hd,[data-theme="monograph"] .paper-hd{text-align:center; margin-inline:auto}
[data-theme="monograph"] .page-hd .t-lede{margin-inline:auto}
[data-theme="monograph"] .article-hd .meta-row,[data-theme="monograph"] .article-hd .crumbs{justify-content:center}
[data-theme="monograph"] .article-body{grid-template-columns:minmax(0, var(--measure)); justify-content:center}
[data-theme="monograph"] .article-body .toc{position:static; grid-column:1; grid-row:auto; max-width:none; border:1px solid var(--rule); border-radius:0; padding:1rem 1.2rem}
[data-theme="monograph"] .prose{text-align:justify; hyphens:auto}
[data-theme="monograph"] .prose h2,[data-theme="monograph"] .prose h3{text-align:center; font-weight:400}
[data-theme="monograph"] .prose h2{font-style:italic}
[data-theme="monograph"] .prose > p + p{margin-top:0; text-indent:1.5em}
[data-theme="monograph"] .prose > p:first-of-type::first-letter{float:left; font-family:var(--f-display); font-size:3.9em; line-height:.8; padding:.06em .1em 0 0}
@media (min-width:1240px){
  [data-theme="monograph"] .prose .sidenote{display:block; float:right; clear:right; width:12rem; margin-right:-15rem; font-family:var(--f-serif); font-size:.8rem; line-height:1.45; color:var(--ink-2); text-align:left; text-indent:0; position:relative}
  [data-theme="monograph"] .prose .sidenote b{color:var(--accent); font-weight:500; margin-right:.25rem}
  [data-theme="monograph"] .footnotes{display:none}
  [data-theme="monograph"] .prose .aside-note{float:right; clear:right; width:12rem; margin-right:-15rem; border:0; padding:0; font-style:italic}
}
[data-theme="monograph"] .lv-toc{max-width:40rem; margin-inline:auto}
[data-theme="monograph"] .now,[data-theme="monograph"] .quote-block{margin-inline:auto}
[data-theme="monograph"] .quote-block{text-align:center}

/* 04 · Swiss — strict grid, grotesk, monochrome */
[data-theme="swiss"] body{letter-spacing:-.005em}
[data-theme="swiss"] h1,[data-theme="swiss"] h2,[data-theme="swiss"] h3{font-weight:700; letter-spacing:-.035em; font-style:normal !important}
[data-theme="swiss"] .site-header{border-top:6px solid var(--ink); background:var(--bg); backdrop-filter:none}
[data-theme="swiss"] .brand{font-family:var(--f-sans); font-weight:700; font-size:1.05rem; letter-spacing:-.02em}
[data-theme="swiss"] .nav a{border-radius:0; font-weight:500; color:var(--ink)}
[data-theme="swiss"] .nav a[aria-current="page"]{background:var(--ink); color:var(--bg)}
[data-theme="swiss"] .nav a[aria-current="page"]::after{display:none}
[data-theme="swiss"] .btn,[data-theme="swiss"] .chip,[data-theme="swiss"] .input,[data-theme="swiss"] .icon-btn{border-radius:0}
[data-theme="swiss"] .hero-swiss{display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); gap:var(--s5); padding-block:var(--s8) var(--s7); border-bottom:1px solid var(--ink)}
[data-theme="swiss"] .hero-name{grid-column:1 / -1; font-family:var(--f-sans); font-weight:700; font-size:clamp(3.4rem, .8rem + 11vw, 12rem); line-height:.84; letter-spacing:-.065em; text-transform:lowercase}
[data-theme="swiss"] .hero-name > span{display:block}
[data-theme="swiss"] .hero-tag{grid-column:1 / span 6; font-family:var(--f-sans); font-style:normal; font-weight:500; font-size:clamp(1.2rem, 1rem + .9vw, 1.7rem); letter-spacing:-.02em; color:var(--ink); max-width:none}
[data-theme="swiss"] .hero-intro{grid-column:7 / span 6; margin-top:var(--s5); font-family:var(--f-sans); font-size:1rem; line-height:1.55}
[data-theme="swiss"] .hero-facts{grid-column:1 / -1; display:grid; grid-template-columns:repeat(auto-fit, minmax(12rem, 1fr)); gap:var(--s4); margin-top:var(--s6); font-family:var(--f-sans); font-size:.85rem; border-top:1px solid var(--ink); padding-top:var(--s3)}
[data-theme="swiss"] .hero-facts b{display:block; font-weight:700}
[data-theme="swiss"] .hero-links{grid-column:1 / -1}
@media (max-width:760px){ [data-theme="swiss"] .hero-tag,[data-theme="swiss"] .hero-intro{grid-column:1 / -1} }
[data-theme="swiss"] .sec{display:grid; gap:var(--s4)}
@media (min-width:900px){ [data-theme="swiss"] .sec{grid-template-columns:3fr 9fr; gap:var(--s5)} [data-theme="swiss"] .sec-hd{flex-direction:column; border:0; border-top:1px solid var(--ink); padding-top:var(--s3); margin:0; align-self:start} }
[data-theme="swiss"] .sec-hd h2{font-family:var(--f-sans); font-size:1.15rem}
[data-theme="swiss"] .lv-grid .cell .ttl,[data-theme="swiss"] .ent .ttl,[data-theme="swiss"] .lv-rows .row .ttl,[data-theme="swiss"] .proj .ttl,[data-theme="swiss"] .note-card .ttl,[data-theme="swiss"] .book .ttl,[data-theme="swiss"] .cv-ent .ttl{font-family:var(--f-sans); font-weight:600; letter-spacing:-.025em}
[data-theme="swiss"] .lv-grid{border-left:0}
[data-theme="swiss"] .page-hd h1,[data-theme="swiss"] .article-hd h1,[data-theme="swiss"] .paper-hd h1{font-family:var(--f-sans); font-weight:700; letter-spacing:-.05em}
[data-theme="swiss"] .article-hd .sub{font-family:var(--f-sans); font-style:normal; font-weight:400; letter-spacing:-.02em}
[data-theme="swiss"] .prose{font-family:var(--f-sans); font-size:calc(var(--body-size) * .92); line-height:1.58}
[data-theme="swiss"] .prose h2,[data-theme="swiss"] .prose h3{font-family:var(--f-sans)}
[data-theme="swiss"] .prose blockquote{font-style:normal; border-left-width:6px; border-color:var(--ink); font-weight:500}
[data-theme="swiss"] .note-card,[data-theme="swiss"] .prose pre{border-radius:0}
[data-theme="swiss"] .quote-block p{font-family:var(--f-sans); font-style:normal; font-weight:600; letter-spacing:-.03em}

/* 05 · Dark Observatory */
[data-theme="observatory"] body{background:radial-gradient(1200px 600px at 80% -10%, color-mix(in oklab, var(--accent) 7%, transparent), transparent 70%) fixed, var(--bg)}
[data-theme="observatory"] .site-header{background:color-mix(in oklab, var(--bg) 75%, transparent)}
[data-theme="observatory"] .brand{font-style:italic}
[data-theme="observatory"] .hero-obs{min-height:min(88vh, 54rem); display:grid; align-content:center; position:relative; padding-block:var(--s8)}
[data-theme="observatory"] .sky{position:absolute; inset:0; z-index:-1; overflow:hidden; pointer-events:none}
[data-theme="observatory"] .sky svg{position:absolute; right:-10%; top:50%; transform:translateY(-50%); width:min(70rem, 120vw); height:auto; opacity:.9}
[data-theme="observatory"] .coord{font-family:var(--f-mono); font-size:.72rem; color:var(--muted); letter-spacing:.04em}
[data-theme="observatory"] .hero-name{font-weight:300; letter-spacing:-.03em; margin-top:var(--s4)}
[data-theme="observatory"] .hero-tag{color:var(--accent)}
[data-theme="observatory"] .sec-hd{border-bottom-color:var(--rule)}
[data-theme="observatory"] .sec-hd h2{font-weight:300}
[data-theme="observatory"] .lv-rows .row{padding-left:1.4rem; position:relative}
[data-theme="observatory"] .lv-rows .row::before{content:""; position:absolute; left:0; top:1.55rem; width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent)}
[data-theme="observatory"] .lv-rows .row .ttl{font-weight:300}
[data-theme="observatory"] .note-card,[data-theme="observatory"] .backlinks{background:color-mix(in oklab, var(--surface) 70%, transparent)}
[data-theme="observatory"] .btn{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
[data-theme="observatory"] .btn-ghost{background:transparent; color:var(--ink); border-color:var(--rule-strong)}
[data-theme="observatory"] .prose blockquote{border-color:var(--accent)}
[data-theme="observatory"] .page-hd h1,[data-theme="observatory"] .article-hd h1{font-weight:300}

/* 06 · Archive — numbered entries, registers, document headers */
[data-theme="archive"] .site-header{background:var(--bg); backdrop-filter:none; border-bottom:1px solid var(--ink)}
[data-theme="archive"] .brand{font-family:var(--f-sans); font-weight:600; font-size:.95rem; flex-direction:row; gap:.6rem; align-items:baseline}
[data-theme="archive"] .brand small{font-family:var(--f-mono)}
[data-theme="archive"] .nav a{border-radius:0; font-family:var(--f-mono); font-size:.78rem}

/* 07 · Modernist — oversized type, asymmetry */

/* 08 · Commonplace Book — paper, marginalia */

/* 09 · Terminal Scholar — mono chrome, clean maths */

/* ---------- 8. Studio (admin) ---------- */
.studio{--st-bg:#F4F2EE; --st-panel:#FBFAF7; --st-ink:#1D1C1A; --st-ink2:#5A5650; --st-muted:#8C877F; --st-rule:#E3DFD8; --st-rule2:#CFC9BF; --st-accent:#2F4BA0; --st-accent-soft:rgba(47,75,160,.1); --st-ok:#2F6B4A; --st-warn:#9A6212; --st-err:#A33A2E;
  font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-size:.9rem; line-height:1.5; color:var(--st-ink); background:var(--st-bg); min-height:100vh; display:grid; grid-template-columns:15.5rem minmax(0,1fr); letter-spacing:-.003em}
[data-mode="dark"] .studio{--st-bg:#18181A; --st-panel:#1F1F22; --st-ink:#ECEAE5; --st-ink2:#B3AFA8; --st-muted:#86827B; --st-rule:#2C2C30; --st-rule2:#3B3B40; --st-accent:#9CB0F0; --st-accent-soft:rgba(156,176,240,.12); --st-ok:#7CC39A; --st-warn:#E0B060; --st-err:#EE8A7E}
.studio ::selection{background:var(--st-accent-soft)}
.studio :focus-visible{outline-color:var(--st-accent)}
.st-side{position:sticky; top:0; height:100vh; overflow:auto; border-right:1px solid var(--st-rule); padding:1.2rem .8rem; display:flex; flex-direction:column; gap:1rem; background:var(--st-panel)}
.st-logo{display:flex; align-items:center; gap:.6rem; padding:.2rem .5rem .6rem; text-decoration:none}
.st-logo .mk{width:1.9rem; height:1.9rem; border-radius:7px; background:var(--st-ink); color:var(--st-bg); display:grid; place-items:center; font-family:"Cormorant Garamond", Georgia, serif; font-size:1.2rem; font-weight:600}
.st-logo b{font-weight:600; font-size:.92rem; display:block} .st-logo small{color:var(--st-muted); font-size:.72rem}
.st-nav{display:grid; gap:1px}
.st-nav .grp{font-size:.7rem; color:var(--st-muted); padding:.9rem .6rem .3rem; font-weight:500}
.st-nav a{display:flex; align-items:center; gap:.65rem; padding:.48rem .6rem; border-radius:7px; text-decoration:none; color:var(--st-ink2); font-size:.86rem}
.st-nav a svg{width:1rem; height:1rem; flex:none; opacity:.8}
.st-nav a:hover{background:var(--st-bg); color:var(--st-ink)}
.st-nav a[aria-current="page"]{background:var(--st-accent-soft); color:var(--st-accent); font-weight:500}
.st-nav a .ct{margin-left:auto; font-size:.72rem; color:var(--st-muted); font-variant-numeric:tabular-nums}
.st-local{margin-top:auto; font-size:.74rem; color:var(--st-ink2); border:1px solid var(--st-rule2); border-radius:10px; padding:.75rem; line-height:1.45}
.st-local b{display:flex; align-items:center; gap:.4rem; color:var(--st-warn); font-weight:600; margin-bottom:.25rem}
.st-main{min-width:0; display:flex; flex-direction:column}
.st-top{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:.75rem; padding:.7rem 1.6rem; border-bottom:1px solid var(--st-rule); background:color-mix(in oklab, var(--st-bg) 90%, transparent); backdrop-filter:blur(8px); min-height:3.6rem}
.st-top h1{font-size:1rem; font-weight:600; margin:0; font-family:inherit; letter-spacing:-.01em}
.st-top .sp{flex:1}
.st-page{padding:1.8rem 1.6rem 5rem; max-width:76rem; width:100%}
.st-page.narrow{max-width:52rem}
.st-h2{font-size:1.5rem; font-weight:600; letter-spacing:-.02em; margin:0 0 .3rem; font-family:inherit}
.st-sub{color:var(--st-ink2); margin:0 0 1.5rem}
.st-btn{display:inline-flex; align-items:center; gap:.45rem; font-size:.82rem; font-weight:500; padding:.5rem .85rem; border-radius:8px; border:1px solid var(--st-rule2); background:var(--st-panel); color:var(--st-ink); text-decoration:none; white-space:nowrap; transition:background-color .15s, border-color .15s}
.st-btn:hover{border-color:var(--st-ink2)}
.st-btn svg{width:.95rem; height:.95rem}
.st-btn.pri{background:var(--st-ink); color:var(--st-bg); border-color:var(--st-ink)}
.st-btn.pri:hover{background:var(--st-accent); border-color:var(--st-accent); color:#fff}

.st-icon{display:inline-grid; place-items:center; width:2rem; height:2rem; border-radius:7px; border:1px solid transparent; background:transparent; color:var(--st-ink2)}

.st-icon[aria-pressed="true"]{background:var(--st-accent-soft); color:var(--st-accent)}
.st-card{background:var(--st-panel); border:1px solid var(--st-rule); border-radius:12px; padding:1.2rem 1.25rem}
.st-card h3{font-size:.86rem; font-weight:600; margin:0 0 .8rem; font-family:inherit; letter-spacing:-.005em}
.st-grid{display:grid; gap:1rem}
.st-grid.c4{grid-template-columns:repeat(auto-fit, minmax(10.5rem, 1fr))}

.st-stat{display:flex; flex-direction:column; gap:.2rem; text-decoration:none}
.st-stat b{font-size:1.9rem; font-weight:600; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums}
.st-stat span{color:var(--st-ink2); font-size:.8rem}
.st-stat small{color:var(--st-muted); font-size:.74rem}
.st-list{list-style:none; margin:0; padding:0}
.st-list li{display:flex; align-items:center; gap:.75rem; padding:.6rem 0; border-top:1px solid var(--st-rule)}
.st-list li:first-child{border-top:0}
.st-list a{text-decoration:none} .st-list a:hover{color:var(--st-accent)}
.st-pill{display:inline-flex; align-items:center; gap:.3rem; font-size:.7rem; font-weight:500; padding:.14rem .5rem; border-radius:999px; background:var(--st-bg); color:var(--st-ink2); border:1px solid var(--st-rule); white-space:nowrap}
.st-pill.published{color:var(--st-ok); border-color:color-mix(in oklab, var(--st-ok) 30%, transparent)}

.st-pill.ex{border-style:dashed}
.st-pill::before{content:""; width:.38rem; height:.38rem; border-radius:50%; background:currentColor}

.bases.posters{--card-min:10.5rem}
.bases.posters .props div{grid-template-columns:3.6rem 1fr}
.bcard{display:flex; flex-direction:column; text-decoration:none; background:var(--surface); border:1px solid var(--rule); border-radius:calc(var(--radius) + 6px); overflow:hidden; transition:border-color .25s, transform .35s var(--ease), box-shadow .35s}
.bcard:hover{border-color:var(--rule-strong); transform:translateY(-3px); box-shadow:0 18px 30px -24px rgba(0,0,0,.45)}
.bimg{position:relative; background:var(--bg-2); overflow:hidden; aspect-ratio:16/9}
.bimg.r-23{aspect-ratio:2/3} .bimg.r-43{aspect-ratio:4/3}
.bimg img,.bimg svg{width:100%; height:100%; object-fit:cover; display:block}
.bimg .play{position:absolute; left:.6rem; bottom:.6rem; width:2rem; height:2rem; border-radius:50%; background:rgba(15,13,11,.72); color:#fff; display:grid; place-items:center}
.bimg .play svg{width:.9rem; height:.9rem}
.bimg .gen-poster{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:12%; color:#F4EEE2}
.bimg .gen-poster b{font-family:var(--f-display); font-weight:500; font-size:1.15rem; line-height:1.1}
.bbody{padding:.8rem .9rem 1rem; display:grid; gap:.55rem}
.bbody .ttl{font-family:var(--f-display); font-size:1.12rem; line-height:1.2; color:var(--ink)}
.bcard:hover .ttl{color:var(--accent)}
.props{margin:0; display:grid; gap:.25rem; font-family:var(--f-sans); font-size:.74rem}
.props div{display:grid; grid-template-columns:4.6rem 1fr; gap:.5rem}
.props dt{color:var(--muted)} .props dd{margin:0; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.group-hd{font-family:var(--f-sans); font-size:.8rem; font-weight:500; color:var(--muted); margin:var(--s6) 0 var(--s4)}
.seg{display:inline-flex; border:1px solid var(--rule-strong); border-radius:999px; overflow:hidden}
.seg button{border:0; background:transparent; padding:.45rem .9rem; font-family:var(--f-sans); font-size:.8rem; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.thumb{width:4.2rem; aspect-ratio:16/9; object-fit:cover; border-radius:4px; background:var(--bg-2); display:block}
.thumb.r-23{width:2.6rem; aspect-ratio:2/3}
.video-embed{position:relative; aspect-ratio:16/9; background:#000; border-radius:calc(var(--radius) + 4px); overflow:hidden; margin:0 0 var(--s6)}
.video-embed iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.watch-hd{display:grid; gap:var(--s6); padding:var(--s8) 0 var(--s6); align-items:end}
@media (min-width:760px){ .watch-hd.poster{grid-template-columns:14rem minmax(0,1fr)} }
.watch-hd > *,.book-hd > *{min-width:0}
.watch-hd .bimg{border-radius:4px; box-shadow:0 14px 24px -16px rgba(0,0,0,.45)}
[data-theme="swiss"] .bcard,[data-theme="archive"] .bcard,[data-theme="modernist"] .bcard,[data-theme="atelier"] .bcard,[data-theme="monograph"] .bcard{border-radius:0}
[data-theme="terminal"] .props,[data-theme="terminal"] .group-hd{font-family:var(--f-mono)}

/* ---------- Header log in button ---------- */
.login-btn{font-family:var(--f-sans); font-size:.8rem; font-weight:500; line-height:1; padding:.55rem .95rem; border:1px solid var(--rule-strong); border-radius:999px; color:var(--ink); text-decoration:none; white-space:nowrap; margin-left:.25rem; transition:background-color .2s, color .2s, border-color .2s}
.login-btn:hover{background:var(--ink); color:var(--bg); border-color:var(--ink)}
[data-theme="swiss"] .login-btn,[data-theme="archive"] .login-btn,[data-theme="modernist"] .login-btn{border-radius:0}
[data-theme="terminal"] .login-btn{font-family:var(--f-mono); border-radius:4px}
@media (max-width:600px){ .hdr-actions .login-btn{display:none} .hdr{gap:var(--s3)} .brand{min-width:0; overflow:hidden; text-overflow:ellipsis} .brand small{white-space:nowrap; overflow:hidden; text-overflow:ellipsis} }

/* ---------- Home typewriter ---------- */
.tw-c{opacity:0} .tw-c.on{opacity:1}
.tw-caret{display:inline-block; width:0; height:.8em; border-left:max(1.5px, .035em) solid var(--accent); margin-right:calc(-1 * max(1.5px, .035em)); vertical-align:-.05em; animation:twBlink 1.1s steps(1) infinite}
.tw-caret.busy{animation:none}
@keyframes twBlink{50%{opacity:0}}
[data-theme="terminal"] .hero-name.typing::after{display:none}
.hero-name.typing{white-space:normal}

/* ---------- Home orbit animation ---------- */
.hero-host{position:relative}
.orbit-anim{display:block; width:10.5rem; margin:var(--s6) 0 0; color:var(--ink); pointer-events:none}
.orbit-anim svg{width:100%; height:auto; overflow:visible}
[data-theme="editorial"] .orbit-anim,[data-theme="monograph"] .orbit-anim{margin-inline:auto}
[data-theme="swiss"] .orbit-anim{grid-column:1 / span 4}
@media (min-width:1000px){
  [data-theme="academic"] .orbit-anim,[data-theme="commonplace"] .orbit-anim,[data-theme="terminal"] .orbit-anim,[data-theme="observatory"] .orbit-anim{position:absolute; right:var(--gutter); top:calc(var(--s8) + 1rem); width:15rem; margin:0}
  [data-theme="observatory"] .orbit-anim{top:auto; bottom:var(--s8)}
}

/* ---------- Studio sign-in, setup guide, cover finder ---------- */
.st-login{grid-template-columns:minmax(0,1fr) !important; place-items:center; padding:2rem 1rem}
.st-login-card{width:min(25rem, 100%); background:var(--st-panel); border:1px solid var(--st-rule); border-radius:16px; padding:2rem 1.8rem; box-shadow:0 30px 60px -40px rgba(0,0,0,.35)}
.st-login-card h1{font-family:"Cormorant Garamond", Georgia, serif; font-weight:500; font-size:2rem; margin:0 0 .3rem; letter-spacing:-.01em}
.st-login-card .st-btn{width:100%; justify-content:center; padding:.7rem}
.st-err{color:var(--st-err); font-size:.8rem; margin:.2rem 0 .8rem; min-height:1.1em}
.steps{counter-reset:step; display:grid; gap:1rem}
.step{min-width:0; background:var(--st-panel); border:1px solid var(--st-rule); border-radius:12px; padding:1.1rem 1.2rem 1.2rem 3.4rem; position:relative; counter-increment:step}
.step::before{content:counter(step); position:absolute; left:1.1rem; top:1.05rem; width:1.6rem; height:1.6rem; border-radius:50%; background:var(--st-bg); border:1px solid var(--st-rule2); display:grid; place-items:center; font-size:.78rem; font-weight:600}
.step.done::before{content:"✓"; background:var(--st-ok); border-color:var(--st-ok); color:#fff}
.step h3{margin:0 0 .4rem; font-size:.95rem; font-family:inherit}
.step p,.step li{font-size:.84rem; color:var(--st-ink2); line-height:1.55}
.step ol,.step ul{padding-left:1.1rem; margin:.4rem 0}
.sql{max-width:100%; font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:.72rem; line-height:1.5; background:var(--st-bg); border:1px solid var(--st-rule); border-radius:8px; padding:.8rem; max-height:16rem; overflow:auto; white-space:pre; margin:.6rem 0}
.finder{display:grid; grid-template-columns:repeat(auto-fill, minmax(7.5rem,1fr)); gap:.7rem; max-height:55vh; overflow:auto; padding:2px}
.finder button{border:1px solid var(--st-rule); border-radius:8px; background:var(--st-panel); padding:0; overflow:hidden; text-align:left; font-size:.7rem; color:var(--st-ink2)}
.finder button:hover,.finder button:focus-visible{border-color:var(--st-accent)}
.finder img{width:100%; aspect-ratio:2/3; object-fit:cover; background:var(--st-bg); display:block}
.finder.wide img{aspect-ratio:16/9}
.finder span{display:block; padding:.35rem .45rem; line-height:1.3}
.st-account{margin-top:.6rem; font-size:.74rem}
.st-account b{display:block; color:var(--st-ok)}

/* Fallbacks for browsers without color-mix() (Safari before 16.2) */
@supports not (color: color-mix(in oklab, red, blue)){
  :root{--accent-soft:rgba(120,120,120,.14); --sel:rgba(120,120,120,.22)}
  .site-header,[data-theme] .site-header,.site-header.scrolled{background:var(--bg)}
  .modal-back{background:rgba(20,18,16,.45)}
  .link,.prose a{text-decoration-color:var(--accent)}
  .studio{--st-accent-soft:rgba(47,75,160,.12)}
}
/* Shared structural helpers */
.marg{display:none}
[data-theme="commonplace"] .marg{display:block}
.article-body > .col{min-width:0}
@media (min-width:1100px){ .article-body > .col{grid-column:1; grid-row:1} }
[data-theme="monograph"] .article-body > .col{grid-row:auto}
.ed-preview .site-body,.ed-preview{margin:0}

/* ---------- 9. Motion & accessibility ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important}
  .reveal{opacity:1; transform:none}
}
html.reduce-motion *,html.reduce-motion *::before,html.reduce-motion *::after{animation:none !important; transition:none !important}
html.reduce-motion .reveal{opacity:1; transform:none}

/* ---------- 10. Print ---------- */
@media print{
  @page{margin:16mm 16mm 18mm}
  :root{--bg:#fff; --surface:#fff; --ink:#111; --ink-2:#333; --muted:#555; --rule:#ccc}
  body{background:#fff !important; color:#111; font-size:10.5pt; line-height:1.45}
  body::before{display:none}
  .site-header,.site-footer,.progress,.to-top,.toasts,.share,.related,.pager,.toc,.cv-actions,.preview-bar,.hero-links,.no-print,.skip{display:none !important}
  .site-body{margin:0 !important}
  .wrap{max-width:none; padding:0}
  .view{padding:0; min-height:0}
  a{text-decoration:none}
  .prose a[href^="http"]::after{content:" (" attr(href) ")"; font-size:.8em; color:#555}
  .cv-hd{padding-top:0}
  .cv-hd h1{font-size:26pt}
  .cv-sec{break-inside:avoid; padding:8pt 0; grid-template-columns:30mm 1fr; gap:4pt 8mm}
  .cv-ent{break-inside:avoid}
  .cv-ent .ttl{font-size:12pt}
  .article-hd{padding-top:0}
  .prose{max-width:none}
  .reveal{opacity:1 !important; transform:none !important}
}

/* Bring stored settings up to date with sections added in later versions (idempotent). */
function normalizeSettings(s, items = []) {
  const seed = seedData().settings;
  s.nav = Array.isArray(s.nav) ? s.nav : seed.nav;
  for (const n of seed.nav) if (!s.nav.some((x) => x.key === n.key)) { const at = s.nav.findIndex((x) => x.key === 'cv'); s.nav.splice(at < 0 ? s.nav.length : at, 0, { ...n }); }

  if (!Array.isArray(s.home.sections)) s.home.sections = seed.home.sections;
  for (const sec of seed.home.sections) if (!s.home.sections.some((x) => x.key === sec.key)) { const at = sec.key === 'featured' ? 1 : s.home.sections.findIndex((x) => x.key === 'quotes'); s.home.sections.splice(at < 0 ? s.home.sections.length : at, 0, { ...sec }); }
  s.home.sections.forEach((x) => { if (!['now', 'featured', 'quotes'].includes(x.key) && !x.mode) x.mode = x.key === 'notes' ? 'latest' : 'featured'; });

/* =====================================================================
   3b. HOSTED BACKEND — Supabase (optional)
   When the page carries a site configuration (project URL + public anon
   key), content is read from and written to Supabase:
     • visitors read published content (enforced by row-level security),
     • only accounts listed in site_admins can write (also enforced there),
     • the Studio requires a real email + password sign-in.
   The anon key is public by design; security comes from the database rules.
   ===================================================================== */
const SiteConfig = (() => {
  const valid = (v) => v && typeof v.supabaseUrl === 'string' && /^https:\/\//.test(v.supabaseUrl) && typeof v.anonKey === 'string' && v.anonKey.length > 20 ? v : null;
  try { const el = document.getElementById('site-config'); const v = valid(el ? JSON.parse(el.textContent || 'null') : null); if (v) return Object.assign(v, { source: 'file' }); } catch (e) {}
  try { const v = valid(JSON.parse(localStorage.getItem('harshaad.siteConfig') || 'null')); if (v) return Object.assign(v, { source: 'browser' }); } catch (e) {}
  return null;
})();

const Supa = {
  url: '', key: '',
  setup(cfg) { this.url = cfg.supabaseUrl.replace(/\/+$/, ''); this.key = cfg.anonKey; },
  headers(extra = {}, useSession = true) {
    const t = useSession && Auth.session && Auth.session.access_token; const h = { apikey: this.key };
    if (t) h.Authorization = 'Bearer ' + t; else if (!this.key.startsWith('sb_')) h.Authorization = 'Bearer ' + this.key; // new publishable keys go in apikey only
    return Object.assign(h, extra);

  async req(path, opts = {}, { useSession = true } = {}) {
    if (useSession) await Auth.ensureFresh();
    let res;
    try { res = await fetch(this.url + path, Object.assign({}, opts, { headers: this.headers(opts.headers || {}, useSession) })); }
    catch (e) { const err = new Error('Could not reach Supabase. Check the internet connection and the project URL.'); err.network = true; throw err; }
    if (!res.ok) {
      let msg = res.status + ' ' + (res.statusText || ''); try { const j = await res.json(); msg = j.message || j.msg || j.error_description || j.error || msg; if (j.hint) msg += ' (' + j.hint + ')'; } catch (_) {}
      const err = new Error(msg); err.status = res.status; throw err;
    }
    const text = res.status === 204 ? '' : await res.text(); if (!text) return null;
    const ct = res.headers.get('content-type') || ''; if (ct.includes('json')) { try { return JSON.parse(text); } catch (_) { return text; } } return text;
  }
};

const Auth = {

  canEdit() { return App.mode === 'local' || (App.mode === 'remote' && this.admin && !!this.session); },
  email() { return (this.session && this.session.user && this.session.user.email) || ''; },
  load() { const s = Prefs.get('session', null); this.session = s && s.access_token ? s : null; },
  save(s) { this.session = s; Prefs.set('session', s); },
  async grant(type, body) {
    let r; try { r = await fetch(`${Supa.url}/auth/v1/token?grant_type=${type}`, { method: 'POST', headers: { apikey: Supa.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
    catch (e) { throw new Error('Could not reach Supabase. Check the internet connection.'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const m = j.error_description || j.msg || j.message || j.error || 'Sign-in failed'; throw new Error(/invalid login|invalid_grant|invalid credentials/i.test(m) ? 'That email and password do not match.' : m); }

    this._refreshing = this.grant('refresh_token', { refresh_token: s.refresh_token }).then((n) => { n.user = n.user && n.user.email ? n.user : s.user; this.save(n); })

    return this._refreshing;
  },
  async checkAdmin() { try { this.admin = (await Supa.req('/rest/v1/rpc/is_site_admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })) === true; } catch (e) { this.admin = false; if (e.network) throw e; } return this.admin; },
  async fetchUser() { try { const u = await Supa.req('/auth/v1/user'); if (u && this.session) { this.session.user = { id: u.id, email: u.email }; this.save(this.session); } } catch (_) {} },
  async signOut() { try { await fetch(Supa.url + '/auth/v1/logout', { method: 'POST', headers: Supa.headers() }); } catch (_) {} this.save(null); this.admin = false; },
  async changePassword(pw) { await Supa.req('/auth/v1/user', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) }); },
