const RemoteBackend = {
  name: 'Supabase (hosted database)', kind: 'remote',
  enc: (s) => encodeURIComponent(String(s)),
  async loadAll() {
    const rows = await Supa.req('/rest/v1/site_records?select=store,id,data&limit=10000');
    const out = { items: [], kv: [], media: [], drafts: [] }; for (const r of rows || []) (out[r.store] = out[r.store] || []).push(r.data); return out;
  },
  async open() { return 'remote'; },
  async get(store, id) { const rows = await Supa.req(`/rest/v1/site_records?select=data&store=eq.${store}&id=eq.${this.enc(id)}`); return rows && rows[0] ? rows[0].data : undefined; },
  async getAll(store) { const rows = await Supa.req(`/rest/v1/site_records?select=data&store=eq.${store}&limit=10000`); return (rows || []).map((r) => r.data); },
  async upload(rec) {
    const ext = (rec.name.match(/\.([a-z0-9]{2,5})$/i) || [, (rec.type.split('/')[1] || 'bin').replace('jpeg', 'jpg').replace('svg+xml', 'svg')])[1].toLowerCase();
    const path = `${rec.id}/${slugify(rec.name.replace(/\.[^.]+$/, '')) || 'file'}.${ext}`;
    await Auth.ensureFresh();
    let res; try { res = await fetch(`${Supa.url}/storage/v1/object/media/${path}`, { method: 'POST', headers: Supa.headers({ 'Content-Type': rec.type || 'application/octet-stream', 'x-upsert': 'true', 'cache-control': '31536000' }), body: rec.blob }); }

    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error('Upload failed: ' + (j.message || j.error || res.status)); }
    const out = Object.assign({}, rec); delete out.blob; out.path = path; out.url = `${Supa.url}/storage/v1/object/public/media/${path}`; return out;
  },
  async put(store, val) {
    const id = val[store === 'kv' ? 'key' : 'id'];
    if (store === 'media' && val.blob) val = await this.upload(val);
    const data = JSON.parse(JSON.stringify(val, (k, v) => (v instanceof Blob ? undefined : v)));
    await Supa.req('/rest/v1/site_records?on_conflict=store,id', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify([{ store, id, data, updated_at: nowISO() }]) });

  },
  async del(store, id, rec) {
    if (store === 'media') { const m = rec || App.media.get(id); if (m && m.path) { try { await Auth.ensureFresh(); await fetch(`${Supa.url}/storage/v1/object/media/${m.path}`, { method: 'DELETE', headers: Supa.headers() }); } catch (_) {} } }

  },
  async clear(store) { await Supa.req(`/rest/v1/site_records?store=eq.${store}`, { method: 'DELETE' }); }
};

/* SQL run once in the Supabase SQL editor. Re-running it is safe. */
function setupSQL(email) {
  const e = String(email || 'YOUR-EMAIL@example.com').trim().replace(/'/g, "''");
  return `-- Personal site: tables, security rules and media bucket.
-- Run once in Supabase → SQL Editor. Running it again is safe.

create table if not exists public.site_records (
  store text not null,
  id text not null,
  data jsonb not null,
  updated_at timestamptz not null default now(),
  primary key (store, id)
);
create table if not exists public.site_admins (
  user_id uuid primary key references auth.users (id) on delete cascade
);
alter table public.site_records enable row level security;
alter table public.site_admins enable row level security;

create or replace function public.is_site_admin()
returns boolean language sql stable security definer set search_path = public
as $$ select exists (select 1 from public.site_admins where user_id = auth.uid()) $$;
grant execute on function public.is_site_admin() to anon, authenticated;

grant select on public.site_records to anon, authenticated;
grant insert, update, delete on public.site_records to authenticated;

-- Visitors can read settings, media and published entries. Drafts stay private.
drop policy if exists "site read" on public.site_records;
create policy "site read" on public.site_records for select using (
  public.is_site_admin()
  or store in ('kv', 'media')
  or (store = 'items' and data->>'status' = 'published')
);
-- Only site admins can change anything.
drop policy if exists "site insert" on public.site_records;
create policy "site insert" on public.site_records for insert with check (public.is_site_admin());
drop policy if exists "site update" on public.site_records;
create policy "site update" on public.site_records for update using (public.is_site_admin()) with check (public.is_site_admin());
drop policy if exists "site delete" on public.site_records;
create policy "site delete" on public.site_records for delete using (public.is_site_admin());

-- Public bucket for images and PDFs; only admins can upload or delete.
insert into storage.buckets (id, name, public) values ('media', 'media', true) on conflict (id) do update set public = true;
drop policy if exists "site media read" on storage.objects;
create policy "site media read" on storage.objects for select using (bucket_id = 'media');
drop policy if exists "site media insert" on storage.objects;
create policy "site media insert" on storage.objects for insert with check (bucket_id = 'media' and public.is_site_admin());
drop policy if exists "site media update" on storage.objects;
create policy "site media update" on storage.objects for update using (bucket_id = 'media' and public.is_site_admin());
drop policy if exists "site media delete" on storage.objects;
create policy "site media delete" on storage.objects for delete using (bucket_id = 'media' and public.is_site_admin());

-- Make your login the site admin. Create the user first (Authentication → Users → Add user).
insert into public.site_admins (user_id)
select id from auth.users where lower(email) = lower('${e}')
on conflict do nothing;

-- Check: this should return one row with your email.
select u.email from public.site_admins a join auth.users u on u.id = a.user_id;
`;
}

/* Cover lookup: Open Library for books, Wikipedia for films, YouTube thumbnails for videos. */
const CoverFinder = {
  async search(it) {

    if (it.type === 'book') {
      const q = d.isbn ? `isbn=${encodeURIComponent(d.isbn.replace(/[^0-9Xx]/g, ''))}` : `title=${encodeURIComponent(it.title)}${d.author ? `&author=${encodeURIComponent(d.author)}` : ''}`;
      const r = await fetch(`https://openlibrary.org/search.json?${q}&fields=title,author_name,cover_i,first_publish_year&limit=12`); if (!r.ok) throw new Error('Open Library did not respond.');
      const j = await r.json();
      for (const doc of j.docs || []) if (doc.cover_i) out.push({ thumb: `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg`, full: `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`, label: `${doc.title}${doc.author_name ? ', ' + doc.author_name[0] : ''}${doc.first_publish_year ? ' (' + doc.first_publish_year + ')' : ''}` });
      if (d.isbn && !out.length) out.push({ thumb: `https://covers.openlibrary.org/b/isbn/${d.isbn.replace(/[^0-9Xx]/g, '')}-M.jpg?default=false`, full: `https://covers.openlibrary.org/b/isbn/${d.isbn.replace(/[^0-9Xx]/g, '')}-L.jpg`, label: 'Cover by ISBN' });
      return { items: out, wide: false, source: 'Open Library' };
    }
    if (it.type === 'watch') {
      const id = youtubeId(d.url);
      if (id) { ['maxresdefault', 'hqdefault', 'sddefault'].forEach((k) => out.push({ thumb: `https://i.ytimg.com/vi/${id}/${k}.jpg`, full: `https://i.ytimg.com/vi/${id}/${k}.jpg`, label: k === 'maxresdefault' ? 'Full-size thumbnail' : k === 'hqdefault' ? 'High quality' : 'Standard' })); return { items: out, wide: true, source: 'YouTube' }; }
      const term = `${it.title} ${d.year || ''} ${d.kind === 'series' ? 'TV series' : d.kind === 'documentary' ? 'documentary' : 'film'}`.trim();
      const r = await fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(term)}&gsrlimit=10&prop=pageimages&piprop=thumbnail&pithumbsize=500&pilicense=any&format=json&origin=*`);
      if (!r.ok) throw new Error('Wikipedia did not respond.'); const j = await r.json();

      return { items: out, wide: false, source: 'Wikipedia' };
    }
    return { items: [], wide: false, source: '' };
  },
  /* Try to keep a copy in the media library; if the image host blocks that, link to it instead. */

   Protects the Studio on this browser with a password you choose.

  get enabled() { return App.mode === 'local' && !!this.rec; },
  get unlocked() {

    try { return sessionStorage.getItem('harshaad.unlocked') === this.rec.hash.slice(0, 24); } catch (e) { return this._mem; }
  },
  mark() { this._mem = true; try { sessionStorage.setItem('harshaad.unlocked', this.rec.hash.slice(0, 24)); } catch (e) {} },
  lock() { this._mem = false; try { sessionStorage.removeItem('harshaad.unlocked'); } catch (e) {} },

    python: 'and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield self print range len np',
    js: 'async await break case catch class const continue debugger default delete do else export extends false finally for function if import in instanceof let new null return super switch this throw true try typeof undefined var void while with yield',
    c: 'auto break case char const continue default do double else enum extern float for goto if inline int long register return short signed sizeof static struct switch typedef union unsigned void volatile while bool true false include define std cout cin endl namespace using class public private template',
    bash: 'if then else elif fi for while do done case esac function in echo export cd ls sudo pip python git',
    matlab: 'function end if else elseif for while switch case otherwise return break continue global persistent plot disp zeros ones linspace',
    latex: '', json: 'true false null', text: ''
  },
  alias: { py: 'python', javascript: 'js', ts: 'js', typescript: 'js', cpp: 'c', 'c++': 'c', sh: 'bash', shell: 'bash', octave: 'matlab', tex: 'latex', typst: 'latex', plain: 'text', '': 'text' },
  html(src, lang) {
    lang = (lang || '').toLowerCase(); lang = this.alias[lang] || lang; const kws = new Set((this.KW[lang] || '').split(' ').filter(Boolean));
    const lc = lang === 'python' || lang === 'bash' ? '#' : lang === 'matlab' ? '%' : lang === 'latex' ? '%' : '//';
    const parts = [];
    const rx = lang === 'text' ? /$^/g : new RegExp([
      lc === '//' ? '(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)' : `(${lc}[^\\n]*)`,
      '("""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'|"(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\'|`(?:\\\\.|[^`\\\\])*`)',
      '(\\b\\d+(?:\\.\\d+)?(?:e[+-]?\\d+)?j?\\b|\\b0x[0-9a-f]+\\b)',
      lang === 'latex' ? '(\\\\[a-zA-Z]+)' : '([A-Za-z_][A-Za-z0-9_]*)(?=\\s*\\()',
      '([A-Za-z_][A-Za-z0-9_]*)'
    ].join('|'), 'gi');
    let last = 0, m;
    while ((m = rx.exec(src))) {
      if (m.index === rx.lastIndex) { rx.lastIndex++; continue; }
      parts.push(esc(src.slice(last, m.index)));
      if (m[1]) parts.push(`<span class="tk-c">${esc(m[1])}</span>`);
      else if (m[2]) parts.push(`<span class="tk-s">${esc(m[2])}</span>`);
      else if (m[3]) parts.push(`<span class="tk-n">${esc(m[3])}</span>`);
      else if (m[4]) parts.push(lang === 'latex' ? `<span class="tk-k">${esc(m[4])}</span>` : kws.has(m[4]) ? `<span class="tk-k">${esc(m[4])}</span>` : `<span class="tk-f">${esc(m[4])}</span>`);
      else if (m[5]) parts.push(kws.has(m[5]) ? `<span class="tk-k">${esc(m[5])}</span>` : esc(m[5]));
      last = rx.lastIndex;
    }
    parts.push(esc(src.slice(last)));
    // split into lines (tokens may span lines, so close/reopen spans per line)
    const html = parts.join(''); const lines = []; let open = [];
    for (const line of html.split('\n')) {
      let l = open.map((c) => `<span class="${c}">`).join('') + line;
      const tags = line.match(/<span class="[^"]+">|<\/span>/g) || [];
      for (const t of tags) { if (t === '</span>') open.pop(); else open.push(t.match(/class="([^"]+)"/)[1]); }
      l += '</span>'.repeat(open.length); lines.push(`<span class="ln">${l}</span>`);
    }
    return lines.join('');
  }
};

/* ---------- Generative covers (deterministic, theme-coloured) ---------- */
function genArt(seedText, { ratio = 4 / 3 } = {}) {
  const r = rng(hashStr(seedText || 'x')); const W = 400, H = Math.round(400 / ratio); const kind = Math.floor(r() * 5);
  let g = '';
  const ink = 'var(--ink)', acc = 'var(--accent)';
  if (kind === 0) { // orbits
    const cx = W * (.3 + r() * .4), cy = H * (.35 + r() * .3);
    for (let i = 1; i < 9; i++) { const rx = 22 * i + r() * 8; g += `<ellipse cx="${cx}" cy="${cy}" rx="${rx * 1.5}" ry="${rx * (.55 + r() * .3)}" transform="rotate(${-18 + r() * 12} ${cx} ${cy})" fill="none" stroke="${ink}" stroke-opacity="${.08 + i * .015}" stroke-width=".8"/>`; }
    const a = r() * 6.28, R = 70 + r() * 60; g += `<circle cx="${cx + Math.cos(a) * R * 1.4}" cy="${cy + Math.sin(a) * R * .6}" r="5" fill="${acc}"/><circle cx="${cx}" cy="${cy}" r="2.5" fill="${ink}"/>`;
  } else if (kind === 1) { // contour waves
    const f = 1 + r() * 2, ph = r() * 6;
    for (let i = 0; i < 18; i++) { let d = `M0 ${H * .1 + i * H / 20}`; for (let x = 0; x <= W; x += 10) { const y = H * .1 + i * H / 20 + Math.sin(x / W * f * 6.28 + ph + i * .25) * (10 + i * 1.3); d += ` L${x} ${y.toFixed(1)}`; } g += `<path d="${d}" fill="none" stroke="${i === 9 ? acc : ink}" stroke-opacity="${i === 9 ? .9 : .18}" stroke-width="${i === 9 ? 1.4 : .8}"/>`; }
  } else if (kind === 2) { // dot field with geodesic
    for (let x = 20; x < W; x += 20) for (let y = 16; y < H; y += 20) g += `<circle cx="${x}" cy="${y}" r="1" fill="${ink}" fill-opacity=".22"/>`;
    const y0 = H * (.2 + r() * .6); g += `<path d="M0 ${y0} C ${W * .3} ${y0 - 80 + r() * 160}, ${W * .6} ${y0 - 80 + r() * 160}, ${W} ${H * (.2 + r() * .6)}" fill="none" stroke="${acc}" stroke-width="1.6"/>`;
  } else if (kind === 3) { // rays from a point (light cone)
    const cx = W * (.2 + r() * .6), cy = H * (.85);
    for (let i = 0; i < 26; i++) { const a = Math.PI + (i / 25) * Math.PI; g += `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a) * W}" y2="${cy + Math.sin(a) * W}" stroke="${ink}" stroke-opacity=".12" stroke-width=".8"/>`; }
    g += `<path d="M${cx - 120} ${cy - 120} L${cx} ${cy} L${cx + 120} ${cy - 120}" fill="none" stroke="${acc}" stroke-width="1.4"/><circle cx="${cx}" cy="${cy}" r="3" fill="${acc}"/>`;
  } else { // grid warped by a mass
    const cx = W * (.3 + r() * .4), cy = H * (.4 + r() * .2), M = 1800 + r() * 2200;
    const warp = (x, y) => { const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy + 900; const k = M / d2; return [x - dx * k * .5, y - dy * k * .5]; };
    for (let gx = 0; gx <= W; gx += 25) { let d = ''; for (let y = 0; y <= H; y += 8) { const [a, b] = warp(gx, y); d += (y ? ' L' : 'M') + a.toFixed(1) + ' ' + b.toFixed(1); } g += `<path d="${d}" fill="none" stroke="${ink}" stroke-opacity=".16" stroke-width=".7"/>`; }
    for (let gy = 0; gy <= H; gy += 25) { let d = ''; for (let x = 0; x <= W; x += 8) { const [a, b] = warp(x, gy); d += (x ? ' L' : 'M') + a.toFixed(1) + ' ' + b.toFixed(1); } g += `<path d="${d}" fill="none" stroke="${ink}" stroke-opacity=".16" stroke-width=".7"/>`; }
    g += `<circle cx="${cx}" cy="${cy}" r="6" fill="${acc}"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract line drawing"><rect width="${W}" height="${H}" fill="var(--bg-2)"/>${g}</svg>`;
}

/* =====================================================================
   12. NAVIGATION — hash router (works on any static host, and from file://)
   ===================================================================== */
const Router = {
  /* When the page is shown inside an embedded preview (srcdoc / sandboxed frame), the
     address bar cannot be changed. The router then keeps the route in memory instead. */
  mem: null,
  current() { return this.mem != null ? this.mem : (location.hash || '#/'); },
  parse() {
    let h = this.current(); if (!h.startsWith('#/')) return null;
    const [p, q] = h.slice(2).split('?');
    const path = p.split('/').filter(Boolean).map(decodeURIComponent);
    const query = {}; new URLSearchParams(q || '').forEach((v, k) => (query[k] = v));
    return { path, query };
  },
  go(hash) {
    if (this.mem == null) {
      try {
        if (location.hash === hash) return this.render();
        location.hash = hash;
        if (location.hash === hash || decodeURIComponent(location.hash) === decodeURIComponent(hash)) return; // hashchange will render
      } catch (e) { /* fall through to in-memory routing */ }
    }
    this.mem = hash; this.render();
  },
  replace(hash) {
    if (this.mem != null) { this.mem = hash; return; }
    try { history.replaceState(history.state, '', hash); if (!location.hash.startsWith(hash.split('?')[0])) this.mem = hash; } catch (e) { this.mem = hash; }
  },
  async render() {
    const r = this.parse(); if (!r) return; const prev = App.route; App.route = r;
    const studio = r.path[0] === 'studio';
    if (studio) { await Studio.render(r); return; }
    if (App.inStudio || !$('.site-body')) { App.inStudio = false; Shell.build(); }
    Studio.teardown && Studio.teardown();
    Shell.markNav(r.path[0] || '');
    const main = $('#main');
    Pages.cleanup();
    const html = await Pages.dispatch(r);
    main.innerHTML = html;
    main.classList.remove('view-enter'); void main.offsetWidth; main.classList.add('view-enter');
    Render.enhance(main); Pages.after(r);
    const samePage = prev && prev.path && prev.path.join('/') === r.path.join('/');
    if (!samePage) window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    Shell.closeMobile();
  }
};
window.addEventListener('hashchange', () => { if (Router.mem == null) Router.render(); });

/* SEO / document metadata per route */
function setMeta({ title, description, image, type = 'website' } = {}) {
  const s = App.settings; const full = title ? `${title} — ${s.siteTitle || s.name}` : `${s.siteTitle || s.name}`;
  document.title = full;

  set('meta[property="og:title"]', 'property', 'og:title', full);
  set('meta[property="og:description"]', 'property', 'og:description', desc);
  set('meta[property="og:type"]', 'property', 'og:type', type);
  if (s.seo.keywords) set('meta[name="keywords"]', 'name', 'keywords', s.seo.keywords);

}

  /* ---------- Writings ---------- */
  writings(q) {

  async findCover() {
    const it = this.it; if (!it.title && !(it.data.isbn || it.data.url)) { UI.toast('Add a title first' + (it.type === 'book' ? ' (or an ISBN).' : ' (or a link).'), 'err'); return null; }

  async fillFromLink(manual) {

    if (!it.title || manual) { it.title = info.title; const t = $('#ed-title'); if (t) { t.value = it.title; this.autogrow(t); } }

/* ---------- small form components ---------- */
function chipInput(host, arr, { suggestions = [], onChange }) {
  const dl = 'dl-' + uid();
  const draw = () => { host.innerHTML = `<div class="st-chipin">${arr.map((t, i) => `<span>${esc(t)}<button type="button" data-x="${i}" aria-label="Remove ${esc(t)}">×</button></span>`).join('')}<input list="${dl}" aria-label="Add item" placeholder="${arr.length ? '' : 'Add…'}"></div><datalist id="${dl}">${suggestions.filter((s) => !arr.includes(s)).map((s) => `<option value="${esc(s)}">`).join('')}</datalist>`; };
  const add = (v) => { v.split(',').map((x) => x.trim()).filter(Boolean).forEach((x) => { if (!arr.includes(x)) arr.push(x); }); onChange(arr); draw(); $('input', host).focus(); };
  draw();
  host.addEventListener('keydown', (e) => { const i = e.target.closest('input'); if (!i) return; if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); if (i.value.trim()) add(i.value); } if (e.key === 'Backspace' && !i.value && arr.length) { arr.pop(); onChange(arr); draw(); $('input', host).focus(); } });
  host.addEventListener('change', (e) => { const i = e.target.closest('input'); if (i && i.value.trim() && suggestions.includes(i.value.trim())) add(i.value); });
  host.addEventListener('focusout', (e) => { const i = e.target.closest('input'); if (i && i.value.trim() && !host.contains(e.relatedTarget)) add(i.value); });
  host.addEventListener('click', (e) => { const x = e.target.closest('[data-x]'); if (x) { arr.splice(+x.dataset.x, 1); onChange(arr); draw(); } else if (e.target.closest('.st-chipin')) $('input', host).focus(); });
}
function miniList(host, arr, fields, onChange, addLabel = 'Add') {
  const draw = () => { host.innerHTML = `<div class="mini-list">${arr.map((row, i) => `<div class="it"><div class="flds">${fields.map((f) => f.ta ? `<textarea class="st-ta" data-i="${i}" data-k="${f.k}" rows="2" placeholder="${esc(f.ph)}">${esc(row[f.k] || '')}</textarea>` : `<input class="st-in" data-i="${i}" data-k="${f.k}" placeholder="${esc(f.ph)}" value="${esc(row[f.k] || '')}">`).join('')}</div>
    <div style="display:grid;gap:2px"><button class="st-icon" type="button" data-up="${i}" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>${ICO.up}</button><button class="st-icon" type="button" data-del="${i}" aria-label="Remove">${ICO.trash}</button></div></div>`).join('')}</div><button class="st-btn sm" type="button" data-addrow style="margin-top:.5rem">${ICO.plus} ${esc(addLabel)}</button>`; };
  draw();
  host.oninput = (e) => { const t = e.target; if (t.dataset.k) { arr[+t.dataset.i][t.dataset.k] = t.value; onChange(arr); } };
  host.onclick = (e) => { const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.addrow !== undefined) { const o = {}; fields.forEach((f) => (o[f.k] = '')); arr.push(o); draw(); onChange(arr); const ins = $$('.it', host); const last = ins[ins.length - 1]; last && $('input,textarea', last).focus(); }
    if (t.dataset.del !== undefined) { arr.splice(+t.dataset.del, 1); draw(); onChange(arr); }
    if (t.dataset.up !== undefined) { const i = +t.dataset.up; if (i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; draw(); onChange(arr); } } };
}

  },

        <p class="st-err" id="lk-err" role="alert"></p><button class="st-btn pri" type="submit">Reset password and log in</button></form>

      : `<p style="color:var(--st-ink2);margin:0 0 1.4rem;font-size:.86rem">Log in to edit ${esc(App.settings.name)}.</p>

        <p class="st-err" id="lk-err" role="alert"></p><button class="st-btn pri" type="submit">Log in</button></form>
        <div class="st-row" style="justify-content:space-between;margin-top:1rem"><button class="st-btn sm ghost" type="button" id="lk-forgot">Forgot password?</button><a class="st-btn sm ghost" href="#/">Back to the site</a></div>`;
    $('#app').innerHTML = `<div class="studio st-login"><main class="st-login-card" aria-labelledby="lk-h"><h1 id="lk-h">${mode === 'setup' ? 'Set a password' : mode === 'recover' ? 'Reset password' : 'Log in'}</h1>${body}</main></div>`;
    const form = $('#lk-form'), err = $('#lk-err'); setTimeout(() => (form.code || form.pw).focus(), 50);

    };
    draw();
  },

/* =====================================================================
   19. MARKDOWN — import and export
   ===================================================================== */
const MD = {
  inline(src) {
    const codes = []; let s = String(src).replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
    s = esc(s);
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, '$1');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_, t, u) => { const safe = Sanitize.safeUrl(u.replace(/&amp;/g, '&')); return safe ? `<a href="${esc(safe)}">${t}</a>` : t; });
    s = s.replace(/\*\*(.+?)\*\*|__(.+?)__/g, (_, a, b) => `<b>${a || b}</b>`);
    s = s.replace(/(^|[^\w*])\*(?!\s)(.+?)\*(?!\w)/g, '$1<i>$2</i>').replace(/(^|[^\w])_(?!\s)(.+?)_(?!\w)/g, '$1<i>$2</i>');
    s = s.replace(/~~(.+?)~~/g, '<s>$1</s>').replace(/==(.+?)==/g, '<mark>$1</mark>');
    s = s.replace(/&lt;u&gt;(.+?)&lt;\/u&gt;/g, '<u>$1</u>').replace(/ {2,}\n|\\\n/g, '<br>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
  },
  toBlocks(md) {
    let text = String(md || '').replace(/\r\n?/g, '\n'); const meta = {};
    const fm = text.match(/^---\n([\s\S]*?)\n---\n?/);
    if (fm) { fm[1].split('\n').forEach((l) => { const m = l.match(/^(\w+):\s*(.*)$/); if (!m) return; let v = m[2].trim().replace(/^["']|["']$/g, ''); if (m[1] === 'tags') v = v.replace(/^\[|\]$/g, '').split(',').map((x) => x.trim().replace(/^["']|["']$/g, '')).filter(Boolean); meta[m[1]] = v; }); text = text.slice(fm[0].length); }
    const notes = {}; text = text.replace(/^\[\^([^\]]+)\]:\s*(.+)$/gm, (_, k, v) => { notes[k] = v.trim(); return ''; });
    const fnify = (html) => html.replace(/\[\^([^\]]+)\]/g, (m, k) => (notes[k] ? `<span class="fn" data-note="${esc(notes[k])}">*</span>` : m));
    const lines = text.split('\n'); const out = []; let para = [];
    const flush = () => { if (para.length) { out.push(nb('p', { html: fnify(this.inline(para.join('\n').replace(/\n(?! )/g, ' '))) })); para = []; } };
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i]; let m;
      if ((m = l.match(/^```\s*([\w+-]*)/))) { flush(); const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); out.push(nb('code', { lang: (m[1] || 'text').toLowerCase(), text: buf.join('\n') })); continue; }
      if ((m = l.match(/^\$\$(.*?)\$\$\s*$/)) && m[1].trim()) { flush(); out.push(nb('math', { tex: m[1].trim() })); continue; }
      if (/^\$\$\s*$/.test(l)) { flush(); const buf = []; i++; while (i < lines.length && !/^\$\$\s*$/.test(lines[i])) buf.push(lines[i++]); out.push(nb('math', { tex: buf.join('\n').trim() })); continue; }
      if (!l.trim()) { flush(); continue; }
      if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { flush(); const lv = m[1].length; if (lv === 1 && !meta.title && !out.length) { meta.title = m[2].trim(); continue; } out.push(nb(lv <= 2 ? 'h2' : lv === 3 ? 'h3' : 'h4', { html: this.inline(m[2].trim()) })); continue; }
      if (/^(\*\s*){3,}$|^(-\s*){3,}$|^(_\s*){3,}$/.test(l.trim())) { flush(); out.push(nb('hr')); continue; }
      if ((m = l.match(/^!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)\s*$/))) { flush(); out.push(nb('image', { src: m[2], alt: m[1], caption: m[3] || '' })); continue; }
      if (/^>/.test(l)) { flush(); const buf = []; while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, '')); i--;
        if (/^\[!(NOTE|ASIDE|TIP)\]/i.test(buf[0] || '')) { out.push(nb('aside', { html: fnify(this.inline(buf.slice(1).join(' ').trim() || buf[0].replace(/^\[![A-Z]+\]\s*/i, ''))) })); continue; }
        let cite = ''; const last = buf[buf.length - 1] || ''; if (/^(—|--)\s*/.test(last)) { cite = last.replace(/^(—|--)\s*/, ''); buf.pop(); }
        out.push(nb('quote', { html: fnify(this.inline(buf.join(' ').trim())), cite })); continue; }
      if ((m = l.match(/^\s*([-*+])\s+(.*)$/))) { flush(); out.push(nb('li', { list: 'ul', html: fnify(this.inline(m[2])) })); continue; }
      if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { flush(); out.push(nb('li', { list: 'ol', html: fnify(this.inline(m[1])) })); continue; }
      if (/^\|/.test(l) && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1])) { flush(); const rows = []; const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => this.inline(c.trim()));
        rows.push(cells(l)); i += 2; while (i < lines.length && /^\|/.test(lines[i])) rows.push(cells(lines[i++])); i--; const w = Math.max(...rows.map((r) => r.length)); rows.forEach((r) => { while (r.length < w) r.push(''); }); out.push(nb('table', { rows, head: true })); continue; }
      para.push(l);
    }
    flush();
    return { meta, body: out };
  },
  inlineFrom(html, notes) {
    const t = document.createElement('template'); t.innerHTML = Sanitize.inline(html || '');
    const walk = (n) => Array.from(n.childNodes).map((c) => {
      if (c.nodeType === 3) return c.nodeValue;
      const inner = walk(c); const tag = c.tagName;
      if (tag === 'B') return `**${inner}**`; if (tag === 'I') return `*${inner}*`; if (tag === 'U') return `<u>${inner}</u>`; if (tag === 'S') return `~~${inner}~~`;
      if (tag === 'CODE') return '`' + c.textContent + '`'; if (tag === 'MARK') return `==${inner}==`; if (tag === 'BR') return '  \n';
      if (tag === 'A') return `[${inner}](${c.getAttribute('href') || ''})`;
      if (tag === 'SPAN' && c.classList.contains('fn')) { notes.push(c.getAttribute('data-note') || ''); return `[^${notes.length}]`; }
      return inner;
    }).join('');
    return walk(t.content);
  },
  fromItem(it, mediaPath = (id) => 'images/' + id) {
    const notes = []; const L = []; const q = (v) => '"' + String(v || '').replace(/"/g, '\\"') + '"';
    L.push('---', `title: ${q(it.title)}`); if (it.subtitle) L.push(`subtitle: ${q(it.subtitle)}`);
    L.push(`type: ${it.type}`, `status: ${it.status}`); if (itemDate(it)) L.push(`date: ${fmtDate(itemDate(it), 'iso')}`);
    if (it.category) L.push(`category: ${q(it.category)}`); if (it.tags.length) L.push(`tags: [${it.tags.map(q).join(', ')}]`);
    if (it.type === 'note') L.push(`growth: ${it.data.growth}`); if (it.type === 'book') L.push(`author: ${q(it.data.author)}`);
    L.push('---', '');
    let olN = 0;
    for (const b of it.body) {
